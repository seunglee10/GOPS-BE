services:
  kis-trader:
    build:
      context: .
      dockerfile: Dockerfile
    image: gops-kis-trader:py3.12
    env_file:
      - path: .env
        required: false
    environment:
      KIS_TOKEN_CACHE_PATH: /kis-cache/kis_token_cache.json
      KAFKA_BOOTSTRAP_SERVERS: broker:19092
      DATABASE_URL: postgresql://gops:gops_dev_password@postgres:5432/gops
    volumes:
      - kis-token-cache:/kis-cache
    command: ["--help"]
    depends_on:
      - broker
      - postgres

  broker:
    image: apache/kafka:latest
    ports:
      - "29092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:19092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: gops
      POSTGRES_USER: gops
      POSTGRES_PASSWORD: gops_dev_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gops -d gops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kis-token-cache:
  postgres-data:
