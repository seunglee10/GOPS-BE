# Clean-rebuild overlay for moving app workloads onto the app-agent NodePool.
# Do not use this for routine GitHub Actions deploys; apply it only after
# the dedicated NodePools exist during the data-preserving rebuild runbook.
# The parent aws-incluster-app overlay now carries the app-agent placement.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../aws-incluster-app
