# GitHub Actions 전용 overlay입니다.
# 앱 Deployment/Service/Ingress만 자동 배포하고, Job은 수동 실행 대상으로 남깁니다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../aws-incluster-app

patches:
  - target:
      group: external-secrets.io
      version: v1beta1
      kind: SecretStore
      name: aws-secrets-manager
    patch: |-
      apiVersion: external-secrets.io/v1beta1
      kind: SecretStore
      metadata:
        name: aws-secrets-manager
        namespace: alfaka-market-data
      $patch: delete
  - target:
      group: external-secrets.io
      version: v1beta1
      kind: ExternalSecret
      name: alfaka-openai-secret
    patch: |-
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: alfaka-openai-secret
        namespace: alfaka-market-data
      $patch: delete
  - target:
      group: batch
      version: v1
      kind: Job
      name: order-migrations
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: order-migrations
        namespace: alfaka-market-data
      $patch: delete
  - target:
      group: batch
      version: v1
      kind: Job
      name: order-reconciler
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: order-reconciler
        namespace: alfaka-market-data
      $patch: delete
  - target:
      group: batch
      version: v1
      kind: Job
      name: alfaka-coverage-repair
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: alfaka-coverage-repair
        namespace: alfaka-market-data
      $patch: delete
  - target:
      group: batch
      version: v1
      kind: Job
      name: alfaka-symbol-registry-sync
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: alfaka-symbol-registry-sync
        namespace: alfaka-market-data
      $patch: delete
  - target:
      group: batch
      version: v1
      kind: Job
      name: alfaka-initial-load
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: alfaka-initial-load
        namespace: alfaka-market-data
      $patch: delete

images:
  - name: <aws-account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-market-ingestor
    newTag: "ci-placeholder"
  - name: <aws-account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-market-processor
    newTag: "ci-placeholder"
  - name: <aws-account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-market-storage
    newTag: "ci-placeholder"
  - name: <aws-account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-backfill-worker
    newTag: "ci-placeholder"
  - name: <aws-account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-api-server
    newTag: "ci-placeholder"
  - name: <aws-account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-frontend
    newTag: "ci-placeholder"
  - name: <aws-account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-order-worker
    newTag: "ci-placeholder"
  - name: <aws-account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-kis-adapter
    newTag: "ci-placeholder"
  - name: <aws-account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-agent-orchestrator
    newTag: "ci-placeholder"
