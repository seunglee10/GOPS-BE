# GitHub Actions 전용 overlay입니다.
# 앱 Deployment/Service/Ingress와 scheduled runtime CronJob을 자동 배포합니다.
# 일회성 Job은 수동 실행 대상으로 남깁니다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../aws-incluster-app

patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: graphdb
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: graphdb
        namespace: alfaka-market-data
      $patch: delete
  - target:
      group: external-secrets.io
      version: v1
      kind: SecretStore
      name: aws-secrets-manager
    patch: |-
      apiVersion: external-secrets.io/v1
      kind: SecretStore
      metadata:
        name: aws-secrets-manager
        namespace: alfaka-market-data
      $patch: delete
  - target:
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
      name: alfaka-openai-secret
    patch: |-
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: alfaka-openai-secret
        namespace: alfaka-market-data
      $patch: delete
  # gops-frontend Deployment는 gops-frontend 저장소의 CI가 소유합니다. 이 overlay가
  # 함께 apply하면 프론트가 배포한 이미지 태그를 덮어쓰므로 여기서는 제외합니다.
  # Service와 Ingress는 트래픽 경로이므로 그대로 둡니다.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: gops-frontend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: gops-frontend
        namespace: alfaka-market-data
      $patch: delete

images:
  - name: <aws-account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-market-ingestor
    newTag: "ci-placeholder"
  - name: <aws-account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-market-processor
    newTag: "ci-placeholder"
  - name: <aws-account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-market-storage
    newTag: "ci-placeholder"
  - name: <aws-account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-api-server
    newTag: "ci-placeholder"
  - name: <aws-account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-order-worker
    newTag: "ci-placeholder"
  - name: <aws-account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-kis-adapter
    newTag: "ci-placeholder"
  - name: <aws-account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-agent-orchestrator
    newTag: "ci-placeholder"
  - name: <aws-account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-simulator
    newTag: "ci-placeholder"
