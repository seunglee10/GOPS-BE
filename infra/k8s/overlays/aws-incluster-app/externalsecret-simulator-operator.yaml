# 역할: AWS Secrets Manager의 시뮬레이터 운영자 이메일 허용 목록을 Kubernetes Secret으로 동기화합니다.
# SecretString은 쉼표로 구분한 이메일 평문이며, manifest와 Pod 로그에는 값을 기록하지 않습니다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alfaka-simulator-operator-secret
  namespace: alfaka-market-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: alfaka-simulator-operator-secret
    creationPolicy: Owner
  data:
    - secretKey: SIMULATOR_OPERATOR_EMAILS
      remoteRef:
        key: sim/operator
