apiVersion: v1
kind: ConfigMap
metadata:
  name: alfaka-market-data-config
  namespace: alfaka-market-data
data:
  AWS_REGION: ap-northeast-2
  AWS_EC2_METADATA_DISABLED: "false"
  S3_ENDPOINT_URL: ""
  ALPACA_SECRET_NAME: dev/alpaca
  KIS_SECRET_NAME: tead/gops/kis
  GOOGLE_OAUTH_SECRET_NAME: oauth/google
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  REDIS_URL: redis://redis:6379/0
  CLICKHOUSE_HTTP_URL: http://clickhouse:8123
  CLICKHOUSE_DATABASE: market_data
  CLICKHOUSE_USER: alfaka
  CLICKHOUSE_LOAD_TRADES: "false"
  AGENT_NEWS_CACHE_BACKEND: auto
  AGENT_NEWS_CACHE_TTL_SECONDS: "300"
  AGENT_NEWS_NO_DATA_CACHE_TTL_SECONDS: "60"
  AGENT_NEWS_LOOKBACK_DAYS: "30"
  AGENT_NEWS_DIRECT_FALLBACK: "false"
  ALPACA_NEWS_INCLUDE_CONTENT: "true"
  ALPACA_NEWS_MAX_RETRIES: "5"
  ALPACA_NEWS_RETRY_SLEEP_SECONDS: "1"
  ALPACA_NEWS_RETRY_MAX_SLEEP_SECONDS: "30"
  NEWS_S3_ARCHIVE_ENABLED: "true"
  NEWS_BACKFILL_UNIVERSE: sp500
  NEWS_BACKFILL_DAYS: "365"
  NEWS_BACKFILL_CHUNK_DAYS: "7"
  NEWS_BACKFILL_LIMIT: "50"
  NEWS_BACKFILL_INCLUDE_CONTENT: "true"
  NEWS_BACKFILL_SORT: asc
  NEWS_BACKFILL_SKIP_COMPLETED_CHUNKS: "true"
  NEWS_BACKFILL_PUBLISH_RECENT_TO_KAFKA: "true"
  NEWS_CLICKHOUSE_DAYS: "30"
  NEWS_INTELLIGENCE_ENABLED: "true"
  NEWS_INTELLIGENCE_PROVIDER: openai
  NEWS_INTELLIGENCE_MODEL: gpt-5.4-mini
  NEWS_INTELLIGENCE_TIMEOUT_SECONDS: "30"
  NEWS_INTELLIGENCE_BATCH_SIZE: "5"
  NEWS_INTELLIGENCE_MAX_POLL_INTERVAL_MS: "900000"
  NEWS_INTELLIGENCE_MAX_POLL_RECORDS: "1"
  NEWS_REDIS_TTL_SECONDS: "1800"
  NEWS_REDIS_MAX_ITEMS: "20"
  NEWS_LOCALIZATION_FALLBACK_ENABLED: "true"
  NEWS_INTELLIGENCE_REBUILD_DAYS: "30"
  NEWS_INTELLIGENCE_REBUILD_BATCH_SIZE: "500"
  NEWS_INTELLIGENCE_REBUILD_MAX_ROWS: "5000"
  NEWS_DAILY_SUMMARY_ENABLED: "true"
  NEWS_DAILY_SUMMARY_PROVIDER: openai
  NEWS_DAILY_SUMMARY_MODEL: gpt-5.4-mini
  NEWS_DAILY_SUMMARY_TIMEOUT_SECONDS: "20"
  NEWS_DAILY_SUMMARY_ARTICLE_LIMIT: "50"
  NEWS_DAILY_REDIS_TTL_SECONDS: "86400"
  NEWS_DAILY_REDIS_MAX_ITEMS: "30"
  NEWS_DAILY_SUMMARY_REBUILD_DAYS: "30"
  NEWS_DAILY_SUMMARY_REBUILD_MAX_GROUPS: "1000"
  AGENT_ANALYSIS_CACHE_BACKEND: auto
  AGENT_ANALYSIS_CACHE_TTL_SECONDS: "180"
  AGENT_ANALYSIS_NO_DATA_CACHE_TTL_SECONDS: "60"
  AGENT_ANALYSIS_CACHE_KEY_PREFIX: gops:agent:analysis
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: gops
  DATABASE_USER: gops
  S3_BUCKET: gops-market-data-<aws-account-id>-ap-northeast-2-an
  S3_RAW_PREFIX: market-data/raw/alpaca
  S3_FINAL_PREFIX: market-data/final
  S3_LIVE_PREFIX: market-data/live
  S3_MATERIALIZE_PREFIX: market-data/final
  S3_PROCESSED_FORMAT: parquet
  S3_FLUSH_COUNT: "500"
  BACKFILL_EXECUTION_MODE: queue
  BACKFILL_STATUS_TTL_SECONDS: "86400"
  BACKFILL_WORKER_POLL_SECONDS: "5"
  BACKFILL_DEFAULT_LOOKBACK_HOURS: "8760"
  AUTH_ENABLED: "true"
  AUTH_PUBLIC_BASE_URL: https://stargops.com
