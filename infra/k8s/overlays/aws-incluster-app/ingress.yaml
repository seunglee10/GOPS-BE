# 역할: stargops.com HTTPS 요청을 ALB를 통해 frontend/backend Service로 라우팅합니다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gops-ingress
  namespace: alfaka-market-data
  annotations:
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:${AWS_ACCOUNT_ID}:certificate/d94bc5c6-249e-4aa1-90f0-b28079160050
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/success-codes: "200-399"
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - host: stargops.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gops-backend
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: gops-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gops-frontend
                port:
                  number: 5173
    - host: www.stargops.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gops-backend
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: gops-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gops-frontend
                port:
                  number: 5173
