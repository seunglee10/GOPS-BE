# 역할: EKS Pod가 S3와 Secrets Manager에 접근할 IRSA Role을 연결합니다.
# 사용: YOUR_IRSA_ROLE_ARN을 Terraform output market_data_irsa_role_arn으로 바꿉니다.
# 주의: 이 권한이 없으면 Alpaca Secret 읽기와 S3 저장이 실패합니다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alfaka-market-data-sa
  namespace: alfaka-market-data
  annotations:
    eks.amazonaws.com/role-arn: YOUR_IRSA_ROLE_ARN
