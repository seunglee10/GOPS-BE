# 역할: EKS Pod가 S3와 Secrets Manager에 접근할 IRSA Role을 연결합니다.
# 사용: EKS Pod가 사용할 IRSA Role ARN을 넣습니다.
# 주의: 이 권한이 없으면 Alpaca Secret 읽기와 S3 저장이 실패합니다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alfaka-market-data-sa
  namespace: alfaka-market-data
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<aws-account-id>:role/alfaka-dev-market-data-irsa
