# 역할: AWS/EKS에 적용할 Kubernetes manifest 조합입니다.
# 사용: PLACEHOLDER를 실제 AWS 값으로 바꾼 뒤 kubectl apply -k로 적용합니다.
# 주의: 현재 stream runtime은 Python market-processor pod입니다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/app
  - secretstore-aws-secrets-manager.yaml
  - externalsecret-openai.yaml
  - scheduled

patches:
  - path: configmap-aws-patch.yaml
  - path: serviceaccount-irsa-aws-patch.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: alfaka-news-daily-summary-worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: recommendation-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/3/secretRef/optional
        value: false
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: agent-orchestrator
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/2/secretRef/optional
        value: false
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: agent-analysis-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/2/secretRef/optional
        value: false
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/3/secretRef/optional
        value: false
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: chart-asset-builder
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/2/secretRef/optional
        value: false
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: deep-analysis-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/2/secretRef/optional
        value: false
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/3/secretRef/optional
        value: false
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: trade-condition-executor
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/1/secretRef/optional
        value: false

images:
  - name: YOUR_ECR_REPOSITORY/gops-market-ingestor
    newName: <aws-account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-market-ingestor
    newTag: 0c876e9
  - name: YOUR_ECR_REPOSITORY/gops-market-processor
    newName: <aws-account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-market-processor
    newTag: 0c876e9
  - name: YOUR_ECR_REPOSITORY/gops-market-storage
    newName: <aws-account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-market-storage
    newTag: 0c876e9
  - name: YOUR_ECR_REPOSITORY/gops-api-server
    newName: <aws-account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-api-server
    newTag: 0c876e9
  - name: YOUR_ECR_REPOSITORY/gops-frontend
    newName: <aws-account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-frontend
    newTag: 0c876e9
  - name: YOUR_ECR_REPOSITORY/gops-order-worker
    newName: <aws-account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-order-worker
    newTag: 0c876e9
  - name: YOUR_ECR_REPOSITORY/gops-kis-adapter
    newName: <aws-account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-kis-adapter
    newTag: 0c876e9
  - name: YOUR_ECR_REPOSITORY/gops-agent-orchestrator
    newName: <aws-account-id>.dkr.ecr.ap-northeast-2.amazonaws.com/alfaka-dev-gops-agent-orchestrator
    newTag: 0c876e9
