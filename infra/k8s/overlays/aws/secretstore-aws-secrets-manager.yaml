# 역할: External Secrets Operator가 AWS Secrets Manager를 IRSA로 읽게 합니다.
# 사전조건: external-secrets.io CRD/컨트롤러가 클러스터에 설치되어 있어야 합니다.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: alfaka-market-data
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: alfaka-market-data-sa
