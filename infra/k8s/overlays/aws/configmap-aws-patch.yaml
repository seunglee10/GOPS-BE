# 역할: AWS MSK/Redis/S3/Secret 연결값을 Kubernetes ConfigMap에 꽂습니다.
# 사용: YOUR_* 값을 Terraform/MSK/Redis 출력값으로 바꿉니다.
# 주의: 비밀값은 ConfigMap이 아니라 Secrets Manager 또는 Secret에 둡니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alfaka-market-data-config
  namespace: alfaka-market-data
data:
  AWS_REGION: ap-northeast-2
  AWS_EC2_METADATA_DISABLED: "false"
  ALPACA_FEED: sip
  ALPACA_FEED_PROFILE: sip
  ALPACA_FEED_PROFILES: sip
  PIPELINE_REQUIRED_COMPONENTS: market-ingestor-sip,market-processor
  MARKET_FEED_PROFILE_PRIORITY: sip,iex,boats,overnight,unknown
  MARKET_OVERNIGHT_FEED_PROFILE_PRIORITY: boats,overnight,sip,iex,unknown
  ALFAKA_REQUEST_CONFIG: systems/market-data/config/market-data-request.json
  ALPACA_UNIVERSE: sp500
  ALPACA_UNIVERSE_REGISTRY_PATH: systems/market-data/config/sp500-universe.json
  ALPACA_CHANNELS: bars,updatedBars,dailyBars,statuses
  ALPACA_ACTIVE_CHANNELS: trades
  ALPACA_MAX_TRADE_SYMBOLS: ""
  ALPACA_MAX_WATCHLIST_TRADE_SYMBOLS: "40"
  ALPACA_MAX_HOT_TRADE_SYMBOLS: "10"
  ALPACA_ACTIVE_POLL_SECONDS: "1"
  HOT_TIER_SIZE: "10"
  HOT_TIER_FALLBACK_SCAN_LIMIT: "503"
  HOT_TIER_PREVIOUS_CLOSE_MAX_AGE_DAYS: "10"
  ALPACA_NEWS_POLL_SECONDS: "300"
  ALPACA_NEWS_LIMIT: "50"
  ALPACA_NEWS_INCLUDE_CONTENT: "false"
  ACTIVE_CHART_TTL_SECONDS: "45"
  ALPACA_CREDENTIAL_SOURCE: aws-secrets-manager
  ALPACA_SECRET_NAME: dev/alpaca
  GOOGLE_OAUTH_SECRET_NAME: oauth/google
  SYMBOL_REGISTRY_ASSET_CLASS: us_equity
  SYMBOL_REGISTRY_STATUS: active
  SYMBOL_REGISTRY_REDIS_CACHE: "true"
  SYMBOL_REGISTRY_REDIS_TTL_SECONDS: "86400"
  KAFKA_BOOTSTRAP_SERVERS: YOUR_MSK_BOOTSTRAP_SERVERS
  KAFKA_RAW_TOPIC_PREFIX: market.raw
  KAFKA_PROCESSOR_GROUP_ID: alfaka-market-processor
  KAFKA_TICKS_TOPIC: market.ticks.v1
  KAFKA_LIVE_CANDLE_TOPIC: market.candles.live.1m.v1
  KAFKA_CLOSED_CANDLE_TOPIC: market.candles.closed.v1
  KAFKA_STATUS_TOPIC: market.status.v1
  KAFKA_VOLUME_PROFILE_BINS_TOPIC: market.volume-profile-bins.1m.v1
  KAFKA_NEWS_TOPIC: market.news.alpaca.v1
  PROCESSOR_LOG_EVERY_N: "500"
  COMPONENT_HEALTH_TTL_SECONDS: "300"
  KAFKA_PROCESSED_TOPICS: market.candles.live.1m.v1,market.candles.closed.v1,market.status.v1,market.volume-profile-bins.1m.v1
  KAFKA_CLICKHOUSE_ENABLE_AUTO_COMMIT: "false"
  KAFKA_CLICKHOUSE_TOPICS: market.candles.closed.v1,market.status.v1,market.volume-profile-bins.1m.v1,market.news.alpaca.v1
  CLICKHOUSE_HTTP_URL: http://YOUR_CLICKHOUSE_ENDPOINT:8123
  CLICKHOUSE_DATABASE: market_data
  CLICKHOUSE_USER: alfaka
  CLICKHOUSE_PROVIDER_ENSURE_SESSION_COLUMNS: "true"
  CLICKHOUSE_ENSURE_SESSION_COLUMNS: "true"
  REDIS_URL: redis://YOUR_REDIS_ENDPOINT:6379/0
  S3_BUCKET: gops-market-data-<aws-account-id>-ap-northeast-2-an
  S3_ARCHIVE_ROOT_PREFIX: market-data/dev/helixho
  S3_FINAL_PREFIX: market-data/dev/helixho/final
  S3_MANIFEST_PREFIX: market-data/dev/helixho/manifest
  S3_BACKFILL_PROCESSED_PREFIX: market-data/dev/helixho/backfill/processed
  S3_BACKFILL_MANIFEST_PREFIX: market-data/dev/helixho/manifest
  S3_BACKFILL_PROCESSED_FORMAT: jsonl
  S3_BACKFILL_PROCESSED_MANIFEST_LAYOUT: compact
  S3_BACKFILL_ARCHIVE_ROWS_PER_OBJECT: "10000"
  BACKFILL_S3_ARCHIVE_ENABLED: "true"
  S3_PROCESSED_FORMAT: parquet
  CLICKHOUSE_LOADER_S3_ARCHIVE_ENABLED: "true"
  S3_CLICKHOUSE_ARCHIVE_FLUSH_ROWS: "1000"
  S3_CLICKHOUSE_ARCHIVE_FLUSH_SECONDS: "60"
  S3_CLICKHOUSE_ARCHIVE_ROWS_PER_OBJECT: "10000"
  S3_PUT_MAX_ATTEMPTS: "3"
  S3_PUT_RETRY_SLEEP_SECONDS: "1"
  HISTORICAL_ADJUSTMENT: split
  MARKET_DATA_MAX_HISTORY_YEARS: "6"
  HISTORICAL_MAX_RETRIES: "5"
  HISTORICAL_RETRY_SLEEP_SECONDS: "1"
  HISTORICAL_RETRY_MAX_SLEEP_SECONDS: "30"
  BACKFILL_STATUS_TTL_SECONDS: "604800"
  BACKFILL_QUEUE_BACKEND: streams
  BACKFILL_STREAM_GROUP: backfill-workers
  BACKFILL_STREAM_RECLAIM_IDLE_MS: "600000"
  BACKFILL_STREAM_MAXLEN: "100000"
  BACKFILL_MAX_ATTEMPTS: "3"
  BACKFILL_GAPFILL_DETECT_INTERNAL: "true"
  BACKFILL_GAPFILL_MAX_DETECT_DAYS_INTRADAY: "7"
  BACKFILL_GAPFILL_MAX_DETECT_DAYS_DAILY: "1500"
  BACKFILL_GAPFILL_TIMESTAMP_LIMIT: "200000"
  BACKFILL_DAILY_FETCH_MAX_DAYS: "1500"
  BACKFILL_INTRADAY_FETCH_MAX_DAYS: "30"
  BACKFILL_WORKER_POLL_SECONDS: "5"
  KAFKA_PROCESSOR_ENABLE_AUTO_COMMIT: "false"
  MARKET_CALENDAR_PROVIDER: configured-nyse
  MARKET_TIMEZONE: America/New_York
  MARKET_OPEN_TIME: "09:30"
  MARKET_CLOSE_TIME: "16:00"
  MARKET_CLOSED_DATES: ""
  MARKET_EARLY_CLOSES: ""
  AGENT_ORCHESTRATOR_URL: http://agent-orchestrator:8100
  AGENT_EVENT_INPUT_TOPICS: market.ticks.v1,market.candles.live.1m.v1,market.candles.closed.v1
  AGENT_MARKET_EVENTS_TOPIC: agents.market-events.v1
  AGENT_ANALYSIS_REQUESTS_TOPIC: agents.analysis-requests.v1
  AGENT_ANALYSIS_RESULTS_TOPIC: agents.analysis-results.v1
  AGENT_NOTIFICATION_DECISIONS_TOPIC: agents.notification-decisions.v1
  AGENT_DLQ_TOPIC: agents.dlq.v1
  AGENT_PUBLISH_TO_KAFKA: "true"
  AGENT_NEWS_CACHE_BACKEND: auto
  AGENT_NEWS_CACHE_TTL_SECONDS: "300"
  AGENT_NEWS_NO_DATA_CACHE_TTL_SECONDS: "60"
  AGENT_NEWS_LOOKBACK_DAYS: "30"
  AGENT_NEWS_DIRECT_FALLBACK: "false"
  AGENT_ANALYSIS_CACHE_BACKEND: auto
  AGENT_ANALYSIS_CACHE_TTL_SECONDS: "180"
  AGENT_ANALYSIS_NO_DATA_CACHE_TTL_SECONDS: "60"
  AGENT_ANALYSIS_CACHE_KEY_PREFIX: gops:agent:analysis
  GRAPHDB_SPARQL_URL: http://graphdb:7200/repositories/nasdaq-fibo
  GRAPHDB_REPOSITORY: nasdaq-fibo
  AGENT_ONTOLOGY_LIMIT: "20"
