# 역할: AWS Secrets Manager의 OpenAI key를 Kubernetes Secret으로 동기화합니다.
# SecretString은 OpenAI API key 원문 문자열이어야 하며, manifest에는 값을 넣지 않습니다.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alfaka-openai-secret
  namespace: alfaka-market-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: alfaka-openai-secret
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: /gops/prod/agent-orchestrator/openai/api-key
