# 역할: AWS Secrets Manager의 SEC User-Agent를 Kubernetes Secret으로 동기화합니다.
# SecretString은 {"SEC_USER_AGENT":"GOPS fundamentals contact@example.com"} JSON이어야 합니다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alfaka-sec-fundamentals-secret
  namespace: alfaka-market-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: alfaka-sec-fundamentals-secret
    creationPolicy: Owner
  data:
    - secretKey: SEC_USER_AGENT
      remoteRef:
        key: /gops/prod/fundamentals/sec-user-agent
        property: SEC_USER_AGENT
