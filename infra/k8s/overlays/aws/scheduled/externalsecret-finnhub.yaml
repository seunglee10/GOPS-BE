# 역할: AWS Secrets Manager의 Finnhub API 키를 Kubernetes Secret으로 동기화합니다(경제 캘린더 수집용).
# SecretString은 {"FINNHUB_API_KEY":"..."} JSON이어야 합니다. 키가 없으면 economic-calendar 잡은 건너뛰고 0으로 끝납니다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alfaka-finnhub-secret
  namespace: alfaka-market-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: alfaka-finnhub-secret
    creationPolicy: Owner
  data:
    - secretKey: FINNHUB_API_KEY
      remoteRef:
        key: /gops/prod/market-data/finnhub
        property: FINNHUB_API_KEY
