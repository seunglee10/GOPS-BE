# 역할: AWS/EKS에서 Yahoo Finance EPS/매출 컨센서스와 현재/replay 24시간 analyst 문장 projection을 갱신합니다.
# schedule은 Kubernetes controller 기준 UTC입니다. 원본 analyst 행은 저장하지 않고 두 문장 projection만 매일 22:30 UTC에 교체합니다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: alfaka-yahoo-estimates-sync
  namespace: alfaka-market-data
spec:
  # The analyst sentence projection expires after 24 hours, so refresh it every day.
  schedule: "30 22 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: alfaka-yahoo-estimates-sync
        spec:
          restartPolicy: Never
          nodeSelector:
            karpenter.sh/nodepool: batch
          tolerations:
            - key: gops.io/dedicated
              operator: Equal
              value: batch
              effect: NoSchedule
          serviceAccountName: alfaka-market-data-sa
          containers:
            - name: yahoo-estimates-sync
              image: YOUR_ECR_REPOSITORY/gops-market-storage:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "-u", "systems/fundamentals/jobs/yahoo-estimates-sync/main.py"]
              env:
                - name: YAHOO_ESTIMATES_DRY_RUN
                  value: "false"
                - name: YAHOO_ESTIMATES_MAX_COMPANIES
                  value: "0"
                - name: YAHOO_ESTIMATES_BATCH_SIZE
                  value: "500"
                - name: YAHOO_ANALYST_REPLAY_CUTOFF
                  value: "2026-07-14T15:00:00Z"
              envFrom:
                - configMapRef:
                    name: alfaka-market-data-config
                - secretRef:
                    name: alfaka-clickhouse-secret
                    optional: true
