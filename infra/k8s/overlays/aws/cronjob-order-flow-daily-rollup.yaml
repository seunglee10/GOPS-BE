# 역할: 정규장 종료 후 pinned symbol의 일별 order-flow profile을 ClickHouse에 적재합니다.
# 21:30 UTC = 17:30 ET (EDT) / 16:30 ET (EST) — always after the 16:00 ET close, weekdays only.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: alfaka-order-flow-daily-rollup
  namespace: alfaka-market-data
spec:
  schedule: "30 21 * * 1-5"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: alfaka-order-flow-daily-rollup
        spec:
          restartPolicy: Never
          nodeSelector:
            karpenter.sh/nodepool: batch
          tolerations:
            - key: gops.io/dedicated
              operator: Equal
              value: batch
              effect: NoSchedule
          serviceAccountName: alfaka-market-data-sa
          containers:
            - name: order-flow-daily-rollup
              image: YOUR_ECR_REPOSITORY/gops-market-processor:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "-u", "systems/market-data/jobs/order-flow-daily-rollup/main.py"]
              envFrom:
                - configMapRef:
                    name: alfaka-market-data-config
                - secretRef:
                    name: alfaka-clickhouse-secret
                    optional: true
