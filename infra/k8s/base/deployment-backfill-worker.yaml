# 역할: 명시적 chart backfill 요청을 Redis queue에서 읽어 S3 raw/processed와 ClickHouse materialization을 수행합니다.
# 사용: IRSA service account로 S3 Get/List/Put 권한을 사용하고, ClickHouse serving projection을 채웁니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alfaka-backfill-worker
  namespace: alfaka-market-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alfaka-backfill-worker
  template:
    metadata:
      labels:
        app: alfaka-backfill-worker
    spec:
      serviceAccountName: alfaka-market-data-sa
      containers:
        - name: backfill-worker
          image: YOUR_ECR_REPOSITORY/alfaka-market-data:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "-m", "alfaka.backfill.worker"]
          envFrom:
            - configMapRef:
                name: alfaka-market-data-config
            - secretRef:
                name: alfaka-clickhouse-secret
                optional: true
            - secretRef:
                name: alfaka-alpaca-secret
                optional: true
