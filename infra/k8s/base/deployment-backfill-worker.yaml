# 역할: 명시적 chart backfill 요청을 Redis queue에서 읽어 Alpaca 데이터를 ClickHouse serving projection에 직접 적재합니다.
# 사용: Alpaca/ClickHouse가 필수이며, S3는 ClickHouse 성공 이후 optional processed archive로만 사용합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alfaka-backfill-worker
  namespace: alfaka-market-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alfaka-backfill-worker
  template:
    metadata:
      labels:
        app: alfaka-backfill-worker
    spec:
      serviceAccountName: alfaka-market-data-sa
      containers:
        - name: backfill-worker
          image: YOUR_ECR_REPOSITORY/gops-backfill-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "systems/market-data/pods/backfill-worker/main.py"]
          envFrom:
            - configMapRef:
                name: alfaka-market-data-config
            - secretRef:
                name: alfaka-clickhouse-secret
                optional: true
            - secretRef:
                name: alfaka-alpaca-secret
                optional: true
