# 역할: Ontology Agent가 조회할 Nasdaq FIBO GraphDB 런타임입니다.
# 주의: GraphDB 데이터/라이선스 volume은 별도 복원 절차로 채우고, repo에는 커밋하지 않습니다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: graphdb
  namespace: alfaka-market-data
spec:
  serviceName: graphdb
  replicas: 1
  selector:
    matchLabels:
      app: graphdb
  template:
    metadata:
      annotations:
        cloudwatch.aws.amazon.com/auto-annotate-dotnet: "false"
        cloudwatch.aws.amazon.com/auto-annotate-java: "false"
        cloudwatch.aws.amazon.com/auto-annotate-nodejs: "false"
        cloudwatch.aws.amazon.com/auto-annotate-python: "false"
        instrumentation.opentelemetry.io/inject-dotnet: "false"
        instrumentation.opentelemetry.io/inject-java: "false"
        instrumentation.opentelemetry.io/inject-nodejs: "false"
        instrumentation.opentelemetry.io/inject-python: "false"
      labels:
        app: graphdb
    spec:
      containers:
        - name: graphdb
          image: ontotext/graphdb:11.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7200
          env:
            - name: GDB_HEAP_SIZE
              value: "4g"
          volumeMounts:
            - name: graphdb-data
              mountPath: /opt/graphdb/home
          readinessProbe:
            httpGet:
              path: /repositories/nasdaq-fibo/size
              port: 7200
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 30
  volumeClaimTemplates:
    - metadata:
        name: graphdb-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: eks-auto-ebs
        resources:
          requests:
            storage: 30Gi
