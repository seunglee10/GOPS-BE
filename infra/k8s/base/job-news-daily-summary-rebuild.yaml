# 역할: NVDA 2026-07-10~2026-07-14 localization row에서 뉴스 키워드를 한 번 생성합니다.
apiVersion: batch/v1
kind: Job
metadata:
  name: alfaka-news-daily-summary-rebuild
  namespace: alfaka-market-data
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: alfaka-news-daily-summary-rebuild
    spec:
      restartPolicy: Never
      nodeSelector:
        karpenter.sh/nodepool: batch
      tolerations:
        - key: gops.io/dedicated
          operator: Equal
          value: batch
          effect: NoSchedule
      serviceAccountName: alfaka-market-data-sa
      containers:
        - name: news-daily-summary-rebuild
          image: YOUR_ECR_REPOSITORY/gops-market-storage:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "systems/market-data/jobs/news-daily-summary-rebuild/main.py"]
          env:
            - name: NEWS_DAILY_SUMMARY_REBUILD_DRY_RUN
              value: "true"
            - name: NEWS_DAILY_SUMMARY_REBUILD_SYMBOLS
              value: NVDA
            - name: NEWS_DAILY_SUMMARY_REBUILD_FROM_DATE
              value: "2026-07-10"
            - name: NEWS_DAILY_SUMMARY_REBUILD_TO_DATE
              value: "2026-07-14"
            - name: NEWS_DAILY_SUMMARY_REBUILD_MAX_GROUPS
              value: "5"
            - name: NEWS_DAILY_SUMMARY_REBUILD_STATUS
              value: auto
          envFrom:
            - configMapRef:
                name: alfaka-market-data-config
            - secretRef:
                name: alfaka-clickhouse-secret
                optional: false
            - secretRef:
                name: alfaka-openai-secret
                optional: false
