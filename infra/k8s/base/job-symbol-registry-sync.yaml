# 역할: Alpaca asset metadata를 ClickHouse symbols table과 Redis metadata cache에 seed합니다.
# 사용: 배포 직후 또는 주기 스케줄러에서 같은 command를 재실행합니다.
apiVersion: batch/v1
kind: Job
metadata:
  name: alfaka-symbol-registry-sync
  namespace: alfaka-market-data
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: alfaka-symbol-registry-sync
    spec:
      restartPolicy: Never
      serviceAccountName: alfaka-market-data-sa
      containers:
        - name: symbol-registry-sync
          image: YOUR_ECR_REPOSITORY/alfaka-market-data:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "-m", "alfaka.tools.sync_symbol_registry"]
          envFrom:
            - configMapRef:
                name: alfaka-market-data-config
            - secretRef:
                name: alfaka-alpaca-secret
                optional: true
            - secretRef:
                name: alfaka-clickhouse-secret
                optional: true
