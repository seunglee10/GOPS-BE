# 역할: Kafka, Redis, S3, Alpaca feed 같은 공통 설정값을 둡니다.
# 사용: 운영 환경마다 이 파일의 YOUR_* 값을 바꿉니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alfaka-market-data-config
  namespace: alfaka-market-data
data:
  AWS_REGION: ap-northeast-2
  ALPACA_FEED: sip
  ALPACA_SYMBOLS: AAPL,TSLA,NVDA
  ALPACA_CHANNELS: bars,updatedBars,trades
  KAFKA_BOOTSTRAP_SERVERS: YOUR_MSK_BOOTSTRAP_SERVERS
  KAFKA_RAW_TOPIC_PREFIX: market.raw
  KAFKA_TICKS_TOPIC: market.ticks.v1
  KAFKA_LIVE_CANDLE_TOPIC: market.candles.live.1m.v1
  KAFKA_CLOSED_CANDLE_TOPIC: market.candles.closed.v1
  PROCESSOR_LOG_EVERY_N: "500"
  KAFKA_PROCESSED_TOPICS: market.ticks.v1,market.candles.closed.v1
  REDIS_URL: redis://YOUR_REDIS_ENDPOINT:6379/0
  S3_BUCKET: YOUR_S3_BUCKET
  S3_PROCESSED_PREFIX: market-data/processed
  S3_FLUSH_COUNT: "500"
  ALPACA_SECRET_NAME: alfaka/alpaca/api
