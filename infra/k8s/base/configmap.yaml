# 역할: Kafka, Redis, S3, Alpaca feed 같은 공통 설정값을 둡니다.
# 사용: 운영 환경마다 이 파일의 YOUR_* 값을 바꿉니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alfaka-market-data-config
  namespace: alfaka-market-data
data:
  AWS_REGION: ap-northeast-2
  ALPACA_FEED: sip
  ALPACA_CHANNELS: bars,updatedBars,dailyBars,statuses
  ALPACA_ACTIVE_CHANNELS: trades
  ALPACA_ACTIVE_TICK_SUBSCRIPTION: "true"
  ALPACA_ACTIVE_POLL_SECONDS: "5"
  ACTIVE_CHART_TTL_SECONDS: "45"
  REDIS_KEY_PREFIX: ""
  ALPACA_TRADING_BASE_URL: https://paper-api.alpaca.markets
  SYMBOL_REGISTRY_ASSET_CLASS: us_equity
  SYMBOL_REGISTRY_STATUS: active
  SYMBOL_REGISTRY_REDIS_CACHE: "true"
  SYMBOL_REGISTRY_REDIS_TTL_SECONDS: "86400"
  KAFKA_BOOTSTRAP_SERVERS: YOUR_MSK_BOOTSTRAP_SERVERS
  KAFKA_RAW_TOPIC_PREFIX: market.raw
  KAFKA_TICKS_TOPIC: market.ticks.v1
  KAFKA_LIVE_CANDLE_TOPIC: market.candles.live.1m.v1
  KAFKA_CLOSED_CANDLE_TOPIC: market.candles.closed.v1
  KAFKA_STATUS_TOPIC: market.status.v1
  KAFKA_VOLUME_PROFILE_BINS_TOPIC: market.volume-profile-bins.1m.v1
  VOLUME_PROFILE_PRICE_BIN_SIZE: "0.05"
  PROCESSOR_LOG_EVERY_N: "500"
  KAFKA_PROCESSED_TOPICS: market.ticks.v1,market.candles.live.1m.v1,market.candles.closed.v1,market.status.v1,market.volume-profile-bins.1m.v1
  KAFKA_CLICKHOUSE_TOPICS: market.candles.closed.v1,market.status.v1,market.volume-profile-bins.1m.v1
  CLICKHOUSE_HTTP_URL: http://YOUR_CLICKHOUSE_ENDPOINT:8123
  CLICKHOUSE_DATABASE: market_data
  CLICKHOUSE_USER: alfaka
  CLICKHOUSE_LOAD_TRADES: "false"
  REDIS_URL: redis://YOUR_REDIS_ENDPOINT:6379/0
  S3_BUCKET: gops-market-data-<aws-account-id>-ap-northeast-2-an
  S3_RAW_PREFIX: market-data/raw/alpaca
  S3_FINAL_PREFIX: market-data/final
  S3_LIVE_PREFIX: market-data/live
  S3_PROCESSED_FORMAT: parquet
  S3_FLUSH_COUNT: "500"
  S3_MATERIALIZE_PREFIX: market-data/final
  BACKFILL_EXECUTION_MODE: queue
  BACKFILL_STATUS_TTL_SECONDS: "86400"
  BACKFILL_WORKER_POLL_SECONDS: "5"
  BACKFILL_DEFAULT_LOOKBACK_HOURS: "8760"
  ALPACA_SECRET_NAME: dev/alpaca
  ORDER_REPOSITORY: postgres
  DATABASE_HOST: YOUR_RDS_POSTGRES_ENDPOINT
  DATABASE_PORT: "5432"
  DATABASE_NAME: gops
  DATABASE_USER: gops
  KIS_ENV: demo
  KIS_SECRET_NAME: dev/kis
  KIS_TOKEN_CACHE_PATH: /kis-cache/demo-token.json
  KIS_ACCOUNT_PRODUCT_CODE: "01"
  KIS_TIMEOUT_SECONDS: "5"
  KAFKA_ACCOUNT_ALIAS: demo-account
  KAFKA_ORDER_COMMANDS_TOPIC: orders.commands.v1
  KAFKA_SUBMIT_RESULTS_TOPIC: broker.submit-results.v1
  KAFKA_ORDER_EVENTS_TOPIC: broker.order-events.v1
  KAFKA_DLQ_TOPIC: orders.dlq.v1
