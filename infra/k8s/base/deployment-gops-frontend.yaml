# 역할: GOPS React frontend를 EKS에 배포합니다.
# 사용: /api, /ws 요청은 Vite proxy 또는 ingress 규칙으로 gops-backend에 연결합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gops-frontend
  namespace: alfaka-market-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gops-frontend
  template:
    metadata:
      labels:
        app: gops-frontend
    spec:
      containers:
        - name: gops-frontend
          image: YOUR_ECR_REPOSITORY/gops-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          env:
            - name: VITE_BACKEND_TARGET
              value: http://gops-backend:8000
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 10
            periodSeconds: 10
