# 역할: GOPS React frontend를 EKS에 배포합니다.
# 사용: /api, /ws 요청은 nginx proxy 또는 ingress 규칙으로 gops-backend에 연결합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gops-frontend
  namespace: alfaka-market-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gops-frontend
  template:
    metadata:
      labels:
        app: gops-frontend
    spec:
      containers:
        - name: gops-frontend
          image: YOUR_ECR_REPOSITORY/gops-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          startupProbe:
            httpGet:
              path: /healthz
              port: 5173
            failureThreshold: 24
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5173
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5173
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
