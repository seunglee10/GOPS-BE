# 역할: Kafka Processed 데이터를 S3에 저장하는 worker를 배포합니다.
# 사용: 장기 저장과 재처리를 위한 파일을 만듭니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alfaka-s3-sink
  namespace: alfaka-market-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alfaka-s3-sink
  template:
    metadata:
      labels:
        app: alfaka-s3-sink
    spec:
      serviceAccountName: alfaka-market-data-sa
      containers:
        - name: s3-sink
          image: YOUR_ECR_REPOSITORY/alfaka-market-data:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "services/06-s3-store/processed_sink.py"]
          envFrom:
            - configMapRef:
                name: alfaka-market-data-config
