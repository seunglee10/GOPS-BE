# 역할: Kafka Raw Topic을 차트용 Processed Topic과 Redis realtime state로 변환합니다.
# 사용: 현재 AWS 배포 단계의 Python stream processor runtime입니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alfaka-market-processor
  namespace: alfaka-market-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alfaka-market-processor
  template:
    metadata:
      labels:
        app: alfaka-market-processor
    spec:
      serviceAccountName: alfaka-market-data-sa
      containers:
        - name: market-processor
          image: YOUR_ECR_REPOSITORY/gops-market-processor:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "systems/market-data/pods/market-processor/local_main.py"]
          envFrom:
            - configMapRef:
                name: alfaka-market-data-config
