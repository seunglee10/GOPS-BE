# 역할: 운영 ClickHouse에 버전형 시장 데이터 마이그레이션을 적용합니다.
apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-migrations
  namespace: alfaka-market-data
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: clickhouse-migrations
    spec:
      restartPolicy: Never
      nodeSelector:
        karpenter.sh/nodepool: batch
      tolerations:
        - key: gops.io/dedicated
          operator: Equal
          value: batch
          effect: NoSchedule
      serviceAccountName: alfaka-market-data-sa
      containers:
        - name: clickhouse-migrations
          image: YOUR_ECR_REPOSITORY/gops-market-storage:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/app/systems/market-data/jobs/clickhouse-migrations/main.py"]
          envFrom:
            - configMapRef:
                name: alfaka-market-data-config
            - secretRef:
                name: alfaka-clickhouse-secret
                optional: true
