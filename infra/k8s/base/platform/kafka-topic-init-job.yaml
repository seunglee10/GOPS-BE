apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  namespace: alfaka-market-data
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: kafka-topic-init
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        karpenter.sh/nodepool: batch
      tolerations:
        - key: gops.io/dedicated
          operator: Equal
          value: batch
          effect: NoSchedule
      containers:
        - name: kafka-topic-init
          image: apache/kafka:3.9.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
          args:
            - |
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
                echo "waiting for kafka"
                sleep 5
              done

              while IFS= read -r topic; do
                if [[ -z "${topic}" || "${topic}" == \#* ]]; then
                  continue
                fi
                if [[ "${topic}" == "market.input.realtime.trades.v1" || "${topic}" == "market.input.realtime.quotes.v1" ]]; then
                  /opt/kafka/bin/kafka-topics.sh \
                    --bootstrap-server kafka:29092 \
                    --create \
                    --if-not-exists \
                    --topic "${topic}" \
                    --partitions 12 \
                    --replication-factor 1
                else
                  /opt/kafka/bin/kafka-topics.sh \
                    --bootstrap-server kafka:29092 \
                    --create \
                    --if-not-exists \
                    --topic "${topic}" \
                    --partitions 3 \
                    --replication-factor 1
                fi

                retention_ms=""
                segment_ms=""
                segment_bytes=""
                case "${topic}" in
                  agents.market-events.v1)
                    retention_ms="3600000"
                    segment_ms="600000"
                    segment_bytes="134217728"
                    ;;
                  market.input.realtime.trades.v1|market.input.realtime.quotes.v1|market.layer.trades.v1|market.layer.quotes.v1)
                    retention_ms="7200000"
                    segment_ms="900000"
                    segment_bytes="268435456"
                    ;;
                esac
                if [[ -n "${retention_ms}" ]]; then
                  /opt/kafka/bin/kafka-configs.sh \
                    --bootstrap-server kafka:29092 \
                    --entity-type topics \
                    --entity-name "${topic}" \
                    --alter \
                    --add-config "retention.ms=${retention_ms},segment.ms=${segment_ms},segment.bytes=${segment_bytes}"
                fi
              done < /etc/alfaka-kafka/topics.txt

              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
          volumeMounts:
            - name: kafka-topics
              mountPath: /etc/alfaka-kafka
              readOnly: true
      volumes:
        - name: kafka-topics
          configMap:
            name: alfaka-kafka-topics
