apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: alfaka-market-data
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      annotations:
        cloudwatch.aws.amazon.com/auto-annotate-dotnet: "false"
        cloudwatch.aws.amazon.com/auto-annotate-java: "false"
        cloudwatch.aws.amazon.com/auto-annotate-nodejs: "false"
        cloudwatch.aws.amazon.com/auto-annotate-python: "false"
        instrumentation.opentelemetry.io/inject-dotnet: "false"
        instrumentation.opentelemetry.io/inject-java: "false"
        instrumentation.opentelemetry.io/inject-nodejs: "false"
        instrumentation.opentelemetry.io/inject-python: "false"
      labels:
        app: redis
    spec:
      nodeSelector:
        karpenter.sh/nodepool: cache-db
      tolerations:
        - key: gops.io/dedicated
          operator: Equal
          value: cache-db
          effect: NoSchedule
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --save
            - ""
            - --dir
            - /data
            # 뉴스 키는 TTL 없이 영구 보존하므로 계속 자란다. volatile-lru는 만료가 걸린 키(차트·세션·
            # 히트맵 등 캐시)만 축출하므로 뉴스는 보호되고, 메모리 압박은 휘발성 캐시가 먼저 흡수한다.
            # 정책을 noeviction으로 바꾸면 한계 도달 시 모든 쓰기가 OOM으로 실패하니 바꾸지 않는다.
            - --maxmemory
            - 6gb
            - --maxmemory-policy
            - volatile-lru
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - test "$(redis-cli ping)" = PONG
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - test "$(redis-cli ping)" = PONG
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - test "$(redis-cli ping)" = PONG
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 120
          resources:
            requests:
              cpu: 300m
              memory: 6Gi
            limits:
              cpu: "1"
              memory: 8Gi
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: eks-auto-ebs
        resources:
          requests:
            storage: 10Gi
