apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: alfaka-market-data
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      annotations:
        cloudwatch.aws.amazon.com/auto-annotate-dotnet: "false"
        cloudwatch.aws.amazon.com/auto-annotate-java: "false"
        cloudwatch.aws.amazon.com/auto-annotate-nodejs: "false"
        cloudwatch.aws.amazon.com/auto-annotate-python: "false"
        instrumentation.opentelemetry.io/inject-dotnet: "false"
        instrumentation.opentelemetry.io/inject-java: "false"
        instrumentation.opentelemetry.io/inject-nodejs: "false"
        instrumentation.opentelemetry.io/inject-python: "false"
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - --appendonly
            - "no"
            - --save
            - ""
            - --dir
            - /tmp
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - test "$(redis-cli ping)" = PONG
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - test "$(redis-cli ping)" = PONG
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - test "$(redis-cli ping)" = PONG
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 120
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: eks-auto-ebs
        resources:
          requests:
            storage: 10Gi
