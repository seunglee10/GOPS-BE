apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: alfaka-market-data
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      annotations:
        cloudwatch.aws.amazon.com/auto-annotate-dotnet: "false"
        cloudwatch.aws.amazon.com/auto-annotate-java: "false"
        cloudwatch.aws.amazon.com/auto-annotate-nodejs: "false"
        cloudwatch.aws.amazon.com/auto-annotate-python: "false"
        instrumentation.opentelemetry.io/inject-dotnet: "false"
        instrumentation.opentelemetry.io/inject-java: "false"
        instrumentation.opentelemetry.io/inject-nodejs: "false"
        instrumentation.opentelemetry.io/inject-python: "false"
      labels:
        app: kafka
    spec:
      nodeSelector:
        karpenter.sh/nodepool: platform-core
      tolerations:
        - key: gops.io/dedicated
          operator: Equal
          value: platform-core
          effect: NoSchedule
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              mkdir -p /var/lib/kafka/data
              cat >/tmp/kraft-server.properties <<'EOF'
              node.id=1
              process.roles=broker,controller
              controller.quorum.voters=1@kafka-0.kafka-headless.alfaka-market-data.svc.cluster.local:9093
              listeners=INTERNAL://:29092,CONTROLLER://:9093
              advertised.listeners=INTERNAL://kafka-0.kafka-headless.alfaka-market-data.svc.cluster.local:29092
              listener.security.protocol.map=INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
              controller.listener.names=CONTROLLER
              inter.broker.listener.name=INTERNAL
              offsets.topic.replication.factor=1
              transaction.state.log.replication.factor=1
              transaction.state.log.min.isr=1
              group.initial.rebalance.delay.ms=0
              num.partitions=3
              auto.create.topics.enable=true
              log.dirs=/var/lib/kafka/data
              EOF
              /opt/kafka/bin/kafka-storage.sh format --ignore-formatted --cluster-id "${CLUSTER_ID}" --config /tmp/kraft-server.properties
              exec /opt/kafka/bin/kafka-server-start.sh /tmp/kraft-server.properties
          ports:
            - name: internal
              containerPort: 29092
            - name: controller
              containerPort: 9093
          env:
            - name: CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk
            - name: KAFKA_HEAP_OPTS
              value: -Xms1g -Xmx2g
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: eks-auto-ebs
        resources:
          requests:
            storage: 30Gi
