# EKS in-cluster platform dependencies for dev/test deployments.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - storageclass-eks-auto-ebs.yaml
  - kafka-service.yaml
  - kafka-statefulset.yaml
  - kafka-topic-init-job.yaml
  - redis-service.yaml
  - redis-statefulset.yaml
  - postgres-service.yaml
  - postgres-statefulset.yaml
  - nodepool-app-agent.yaml
  - nodepool-batch.yaml
  - nodepool-batch-warm.yaml
  - nodepool-cache-db.yaml
  - nodepool-streaming.yaml
  - nodepool-graphdb.yaml
  - nodepool-clickhouse.yaml
  - clickhouse-service.yaml
  - clickhouse-statefulset.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: alfaka-kafka-topics
    namespace: alfaka-market-data
    files:
      - topics.txt=kafka/topics.txt
  - name: alfaka-clickhouse-initdb
    namespace: alfaka-market-data
    files:
      - 01-market-data.sql=clickhouse-initdb/01-market-data.sql
      - 02-sec-fundamentals.sql=clickhouse-initdb/02-sec-fundamentals.sql
