apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: alfaka-market-data
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      nodeSelector:
        karpenter.sh/nodepool: clickhouse
      tolerations:
        - key: gops.io/dedicated
          operator: Equal
          value: clickhouse
          effect: NoSchedule
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.12-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          env:
            - name: CLICKHOUSE_DB
              value: market_data
            - name: CLICKHOUSE_USER
              value: alfaka
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alfaka-clickhouse-secret
                  key: CLICKHOUSE_PASSWORD
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          volumeMounts:
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
            - name: clickhouse-initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          startupProbe:
            httpGet:
              path: /ping
              port: 8123
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /ping
              port: 8123
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 3500m
              memory: 6Gi
            limits:
              cpu: "4"
              memory: 8Gi
      volumes:
        - name: clickhouse-initdb
          configMap:
            name: alfaka-clickhouse-initdb
  volumeClaimTemplates:
    - metadata:
        name: clickhouse-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: eks-auto-ebs
        resources:
          requests:
            storage: 80Gi
