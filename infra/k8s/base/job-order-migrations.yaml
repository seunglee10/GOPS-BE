# 역할: 주문/체결 신뢰성 테이블을 PostgreSQL/RDS에 생성하거나 갱신합니다.
# 사용: EKS 배포 시 API/worker 시작 전 1회 실행합니다.
apiVersion: batch/v1
kind: Job
metadata:
  name: order-migrations
  namespace: alfaka-market-data
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: order-migrations
    spec:
      restartPolicy: Never
      nodeSelector:
        karpenter.sh/nodepool: batch
      tolerations:
        - key: gops.io/dedicated
          operator: Equal
          value: batch
          effect: NoSchedule
      serviceAccountName: alfaka-market-data-sa
      containers:
        - name: order-migrations
          image: YOUR_ECR_REPOSITORY/gops-order-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "systems/order/jobs/migrations/main.py"]
          envFrom:
            - configMapRef:
                name: alfaka-market-data-config
            - secretRef:
                name: alfaka-order-db-secret
                optional: true
