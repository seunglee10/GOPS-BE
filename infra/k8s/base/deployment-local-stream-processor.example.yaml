# 역할: Flink 대신 임시 Python 처리기를 EKS에 올리는 예시입니다.
# 사용: 운영 최종형이 아니라 개발/검증용 대체 배포입니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alfaka-local-stream-processor
  namespace: alfaka-market-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alfaka-local-stream-processor
  template:
    metadata:
      labels:
        app: alfaka-local-stream-processor
    spec:
      serviceAccountName: alfaka-market-data-sa
      containers:
        - name: local-stream-processor
          image: YOUR_ECR_REPOSITORY/alfaka-market-data:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "services/03-flink-stream-processor/local_main.py"]
          envFrom:
            - configMapRef:
                name: alfaka-market-data-config
