# 역할: 실시간 최우선호가로 영구 가상투자 지정가 주문을 체결합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paper-live-matcher
  namespace: alfaka-market-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paper-live-matcher
  template:
    metadata:
      labels:
        app: paper-live-matcher
    spec:
      serviceAccountName: alfaka-market-data-sa
      containers:
        - name: paper-live-matcher
          image: YOUR_ECR_REPOSITORY/gops-order-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "systems/order/pods/paper-live-matcher/main.py"]
          envFrom:
            - configMapRef:
                name: alfaka-market-data-config
            - secretRef:
                name: alfaka-order-db-secret
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            exec:
              command: ["python", "-m", "kis_trader.runtime_heartbeat", "--max-age-seconds", "120"]
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command: ["python", "-m", "kis_trader.runtime_heartbeat", "--max-age-seconds", "30"]
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["python", "-m", "kis_trader.runtime_heartbeat", "--max-age-seconds", "60"]
            periodSeconds: 20
            failureThreshold: 3
