# 역할: 역할 기반 GOPS 멀티 에이전트 오케스트레이터를 EKS에 배포합니다.
# 사용: gops-backend는 이 pod로 분석 요청을 위임합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-orchestrator
  namespace: alfaka-market-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-orchestrator
  template:
    metadata:
      labels:
        app: agent-orchestrator
    spec:
      serviceAccountName: alfaka-market-data-sa
      containers:
        - name: agent-orchestrator
          image: YOUR_ECR_REPOSITORY/gops-agent-orchestrator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8100
          envFrom:
            - configMapRef:
                name: alfaka-market-data-config
            - secretRef:
                name: alfaka-clickhouse-secret
                optional: true
            - secretRef:
                name: alfaka-openai-secret
                optional: true
            - secretRef:
                name: alfaka-order-db-secret
                optional: false
          readinessProbe:
            httpGet:
              path: /health
              port: 8100
            initialDelaySeconds: 10
            periodSeconds: 10
