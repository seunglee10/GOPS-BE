# 역할: Alpaca News API 수집기를 EKS에 배포합니다.
# 사용: 뉴스 데이터를 Kafka processed topic으로 보내고 ClickHouse loader가 적재합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alfaka-alpaca-news-ingestor
  namespace: alfaka-market-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alfaka-alpaca-news-ingestor
  template:
    metadata:
      labels:
        app: alfaka-alpaca-news-ingestor
    spec:
      serviceAccountName: alfaka-market-data-sa
      containers:
        - name: alpaca-news-ingestor
          image: YOUR_ECR_REPOSITORY/gops-market-ingestor:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "systems/market-data/pods/news-ingestor/main.py"]
          envFrom:
            - configMapRef:
                name: alfaka-market-data-config
            - secretRef:
                name: alfaka-alpaca-secret
                optional: true
