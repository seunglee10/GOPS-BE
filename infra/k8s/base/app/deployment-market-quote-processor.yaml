# 역할: Kafka raw quote topic만 읽어 quote layer topic과 Redis realtime quote state로 변환합니다.
# 사용: quote 폭주가 trade/candle processor를 막지 않도록 별도 consumer group으로 실행합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alfaka-market-quote-processor
  namespace: alfaka-market-data
spec:
  replicas: 3
  selector:
    matchLabels:
      app: alfaka-market-quote-processor
  template:
    metadata:
      labels:
        app: alfaka-market-quote-processor
    spec:
      serviceAccountName: alfaka-market-data-sa
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 3
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: alfaka-market-quote-processor
      containers:
        - name: market-quote-processor
          image: YOUR_ECR_REPOSITORY/gops-market-processor:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "systems/market-data/pods/market-processor/local_main.py"]
          env:
            - name: KAFKA_PROCESSOR_GROUP_ID
              value: alfaka-market-quote-processor
            - name: KAFKA_PROCESSOR_RAW_TOPICS
              value: market.input.realtime.quotes.v1
          envFrom:
            - configMapRef:
                name: alfaka-market-data-config
            - secretRef:
                name: alfaka-clickhouse-secret
                optional: true
          startupProbe:
            exec:
              command: ["python", "-m", "alfaka.common.heartbeat", "--max-age-seconds", "300"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["python", "-m", "alfaka.common.heartbeat", "--max-age-seconds", "60"]
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["python", "-m", "alfaka.common.heartbeat", "--max-age-seconds", "120"]
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
