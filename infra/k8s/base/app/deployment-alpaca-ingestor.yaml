# 역할: Alpaca SIP WebSocket 수집기를 EKS에 배포합니다.
# 사용: baseline bars와 active chart trades/quotes를 한 SIP 연결에서 Kafka Raw Topic으로 보냅니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alfaka-alpaca-ingestor-sip
  namespace: alfaka-market-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alfaka-alpaca-ingestor-sip
  template:
    metadata:
      labels:
        app: alfaka-alpaca-ingestor-sip
    spec:
      serviceAccountName: alfaka-market-data-sa
      containers:
        - name: alpaca-ingestor
          image: YOUR_ECR_REPOSITORY/gops-market-ingestor:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "systems/market-data/pods/market-ingestor/market_stream.py"]
          envFrom:
            - configMapRef:
                name: alfaka-market-data-config
            - secretRef:
                name: alfaka-alpaca-secret
                optional: true
          env:
            - name: ALPACA_FEED_PROFILE
              value: sip
            - name: ALPACA_ACTIVE_CHANNELS
              value: trades,quotes
            - name: KAFKA_CLIENT_ID
              value: alfaka-alpaca-ingestor-sip
---
# 역할: Alpaca BOATS/overnight WebSocket 수집기를 EKS에 배포합니다.
# 사용: 20:00-04:00 ET overnight feed를 SIP daytime feed와 분리해 관측합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alfaka-alpaca-ingestor-boats
  namespace: alfaka-market-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alfaka-alpaca-ingestor-boats
  template:
    metadata:
      labels:
        app: alfaka-alpaca-ingestor-boats
    spec:
      serviceAccountName: alfaka-market-data-sa
      containers:
        - name: alpaca-ingestor
          image: YOUR_ECR_REPOSITORY/gops-market-ingestor:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "systems/market-data/pods/market-ingestor/market_stream.py"]
          envFrom:
            - configMapRef:
                name: alfaka-market-data-config
            - secretRef:
                name: alfaka-alpaca-secret
                optional: true
          env:
            - name: ALPACA_FEED_PROFILE
              value: boats
            - name: ALPACA_COLLECTION_SYMBOL_SOURCE
              value: on-demand
            - name: KAFKA_CLIENT_ID
              value: alfaka-alpaca-ingestor-boats
---
# 역할: Alpaca Crypto WebSocket 수집기를 EKS에 배포합니다.
# 사용: BTCUSD 같은 24/7 crypto feed를 주식 SIP/BOATS feed와 분리해 관측합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alfaka-alpaca-ingestor-crypto
  namespace: alfaka-market-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alfaka-alpaca-ingestor-crypto
  template:
    metadata:
      labels:
        app: alfaka-alpaca-ingestor-crypto
    spec:
      serviceAccountName: alfaka-market-data-sa
      containers:
        - name: alpaca-ingestor
          image: YOUR_ECR_REPOSITORY/gops-market-ingestor:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "systems/market-data/pods/market-ingestor/market_stream.py"]
          envFrom:
            - configMapRef:
                name: alfaka-market-data-config
            - secretRef:
                name: alfaka-alpaca-secret
                optional: true
          env:
            - name: ALPACA_FEED_PROFILE
              value: crypto-us
            - name: KAFKA_CLIENT_ID
              value: alfaka-alpaca-ingestor-crypto
            - name: ALPACA_COLLECTION_SYMBOLS
              value: BTCUSD
            - name: ALPACA_CHANNELS
              value: bars,updatedBars,dailyBars,trades,quotes
            - name: ALPACA_ACTIVE_TICK_SUBSCRIPTION
              value: "false"
