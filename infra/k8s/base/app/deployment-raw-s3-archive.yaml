# 역할: Kafka Raw Alpaca 데이터를 S3 raw archive에 저장하는 worker를 배포합니다.
# 사용: Kafka retention 밖에서도 replay/repair 가능한 원본 증거를 남깁니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alfaka-raw-s3-archive
  namespace: alfaka-market-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alfaka-raw-s3-archive
  template:
    metadata:
      labels:
        app: alfaka-raw-s3-archive
    spec:
      serviceAccountName: alfaka-market-data-sa
      containers:
        - name: raw-s3-archive
          image: YOUR_ECR_REPOSITORY/gops-market-storage:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "systems/market-data/pods/s3-sink/raw_archive_sink.py"]
          envFrom:
            - configMapRef:
                name: alfaka-market-data-config
