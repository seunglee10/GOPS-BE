# 역할: EKS Pod가 AWS Secrets Manager/S3에 접근할 IAM Role을 연결합니다.
# 사용: YOUR_ACCOUNT_ID와 YOUR_IRSA_ROLE_NAME을 바꿉니다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alfaka-market-data-sa
  namespace: alfaka-market-data
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::YOUR_ACCOUNT_ID:role/YOUR_IRSA_ROLE_NAME
