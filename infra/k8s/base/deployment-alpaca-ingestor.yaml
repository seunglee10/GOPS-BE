# 역할: Alpaca WebSocket 수집기를 EKS에 배포합니다.
# 사용: Alpaca 데이터를 Kafka Raw Topic으로 보냅니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alfaka-alpaca-ingestor
  namespace: alfaka-market-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alfaka-alpaca-ingestor
  template:
    metadata:
      labels:
        app: alfaka-alpaca-ingestor
    spec:
      serviceAccountName: alfaka-market-data-sa
      containers:
        - name: alpaca-ingestor
          image: YOUR_ECR_REPOSITORY/alfaka-market-data:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "services/01-alpaca-connector/market_stream.py"]
          envFrom:
            - configMapRef:
                name: alfaka-market-data-config
            - secretRef:
                name: alfaka-alpaca-secret
                optional: true
