# 역할: ClickHouse에 저장된 오래된 뉴스 hot data를 주기적으로 정리합니다.
# 사용: CLICKHOUSE_NEWS_RETENTION_DAYS 기준보다 오래된 news_articles 레코드를 삭제 요청합니다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: alfaka-news-retention
  namespace: alfaka-market-data
spec:
  schedule: "30 3 * * *"
  timeZone: "Asia/Seoul"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: alfaka-news-retention
        spec:
          serviceAccountName: alfaka-market-data-sa
          restartPolicy: Never
          containers:
            - name: news-retention
              image: YOUR_ECR_REPOSITORY/gops-market-storage:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "-u", "systems/market-data/jobs/news-retention/main.py"]
              envFrom:
                - configMapRef:
                    name: alfaka-market-data-config
                - secretRef:
                    name: alfaka-clickhouse-secret
                    optional: true
