# 역할: 20-symbol canonical history Initial Load를 chunked Redis Streams jobs로 계획/큐잉합니다.
# 사용: 기본은 dry-run입니다. 실제 enqueue는 INITIAL_LOAD_DRY_RUN=false로 별도 patch 후 실행합니다.
apiVersion: batch/v1
kind: Job
metadata:
  name: alfaka-initial-load
  namespace: alfaka-market-data
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: alfaka-initial-load
    spec:
      restartPolicy: Never
      serviceAccountName: alfaka-market-data-sa
      containers:
        - name: initial-load
          image: YOUR_ECR_REPOSITORY/gops-market-processor:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "systems/market-data/jobs/initial-load/main.py"]
          env:
            - name: INITIAL_LOAD_SYMBOLS
              value: AAPL,MSFT,NVDA,AMZN,GOOGL,META,TSLA,BRK.B,JPM,UNH,V,XOM,MA,AVGO,PG,COST,HD,JNJ,NFLX,AMD
            - name: INITIAL_LOAD_INTERVALS
              value: 1D
            - name: INITIAL_LOAD_START
              value: ""
            - name: INITIAL_LOAD_END
              value: ""
            - name: INITIAL_LOAD_DRY_RUN
              value: "true"
            - name: INITIAL_LOAD_FORCE
              value: "false"
            - name: INITIAL_LOAD_SOURCE_PREFERENCE
              value: coverage-first
            - name: INITIAL_LOAD_MAX_ENQUEUE
              value: "100"
            - name: INITIAL_LOAD_MAX_BACKLOG
              value: "1000"
          envFrom:
            - configMapRef:
                name: alfaka-market-data-config
