# 역할: API 기준 chart coverage를 감사하고 부족한 source interval backfill을 큐잉합니다.
# 사용: 기본은 dry-run입니다. 실제 repair는 COVERAGE_REPAIR_DRY_RUN=false로 별도 patch 후 실행합니다.
apiVersion: batch/v1
kind: Job
metadata:
  name: alfaka-coverage-repair
  namespace: alfaka-market-data
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: alfaka-coverage-repair
    spec:
      restartPolicy: Never
      serviceAccountName: alfaka-market-data-sa
      containers:
        - name: coverage-repair
          image: YOUR_ECR_REPOSITORY/gops-market-processor:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "systems/market-data/jobs/coverage-repair/main.py"]
          env:
            - name: GOPS_API_BASE_URL
              value: http://gops-backend:8000
            - name: COVERAGE_REPAIR_SYMBOLS
              value: NVDA,AMD,AVGO,TSM,ASML,AMAT,MU
            - name: COVERAGE_REPAIR_INTERVALS
              value: 1m,5m,10m,1D,1W,1M
            - name: COVERAGE_REPAIR_DRY_RUN
              value: "true"
            - name: COVERAGE_REPAIR_FORCE
              value: "false"
          envFrom:
            - configMapRef:
                name: alfaka-market-data-config
