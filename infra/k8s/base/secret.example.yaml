# 역할: 임시 실험용 Alpaca API 키 Secret 예시입니다.
# 사용: 운영에서는 AWS Secrets Manager + IRSA를 권장합니다.
apiVersion: v1
kind: Secret
metadata:
  name: alfaka-alpaca-secret
  namespace: alfaka-market-data
type: Opaque
stringData:
  # 운영 권장: 이 파일에 직접 키를 넣기보다 AWS Secrets Manager + IRSA를 사용합니다.
  # 로컬/임시 K8s 실험에서만 아래 값을 실제 Alpaca 키로 바꿔 사용하세요.
  APCA_API_KEY_ID: YOUR_ALPACA_KEY_ID
  APCA_API_SECRET_KEY: YOUR_ALPACA_SECRET_KEY

---
# 역할: GOPS Agent의 OpenAI API 호출에 필요한 Secret 예시입니다.
# 사용: 로컬/임시 K8s 실험에서만 값을 채우고, 운영에서는 외부 Secret 관리 체계를 사용하세요.
# AWS/EKS 운영 overlay는 AWS Secrets Manager
# /gops/prod/agent-orchestrator/openai/api-key 값을 alfaka-openai-secret의
# OPENAI_API_KEY로 동기화합니다.
apiVersion: v1
kind: Secret
metadata:
  name: alfaka-openai-secret
  namespace: alfaka-market-data
type: Opaque
stringData:
  OPENAI_API_KEY: YOUR_OPENAI_API_KEY

---
# 역할: GOPS Google OAuth와 session cookie에 필요한 Kubernetes Secret 예시입니다.
# 사용: 임시로 env 직접 주입이 필요할 때만 씁니다. 운영에서는 GOOGLE_OAUTH_SECRET_NAME으로
#       AWS Secrets Manager JSON을 읽는 방식을 권장합니다.
apiVersion: v1
kind: Secret
metadata:
  name: alfaka-auth-secret
  namespace: alfaka-market-data
type: Opaque
stringData:
  GOOGLE_OAUTH_CLIENT_ID: YOUR_GOOGLE_OAUTH_CLIENT_ID
  GOOGLE_OAUTH_CLIENT_SECRET: YOUR_GOOGLE_OAUTH_CLIENT_SECRET
  AUTH_SESSION_SECRET: YOUR_LONG_RANDOM_SESSION_SECRET

---
# 역할: 주문 API와 주문 worker가 PostgreSQL/RDS 및 idempotency hash에 사용하는 Secret 예시입니다.
# 사용: 운영에서는 이 값을 실제 Secret 또는 External Secrets 방식으로 주입합니다.
apiVersion: v1
kind: Secret
metadata:
  name: alfaka-order-db-secret
  namespace: alfaka-market-data
type: Opaque
stringData:
  DATABASE_PASSWORD: YOUR_POSTGRES_PASSWORD
  IDEMPOTENCY_HASH_SECRET: YOUR_LONG_RANDOM_HASH_SECRET

# AWS Secrets Manager의 tead/gops/kis Secret은 아래 JSON 형태를 사용합니다.
# {
#   "KIS_DEMO_APP_KEY": "...",
#   "KIS_DEMO_APP_SECRET": "...",
#   "KIS_DEMO_ACCOUNT_NO": "..."
# }
