# 역할: 임시 실험용 Alpaca API 키 Secret 예시입니다.
# 사용: 운영에서는 AWS Secrets Manager + IRSA를 권장합니다.
apiVersion: v1
kind: Secret
metadata:
  name: alfaka-alpaca-secret
  namespace: alfaka-market-data
type: Opaque
stringData:
  # 운영 권장: 이 파일에 직접 키를 넣기보다 AWS Secrets Manager + IRSA를 사용합니다.
  # 로컬/임시 K8s 실험에서만 아래 값을 실제 Alpaca 키로 바꿔 사용하세요.
  APCA_API_KEY_ID: YOUR_ALPACA_KEY_ID
  APCA_API_SECRET_KEY: YOUR_ALPACA_SECRET_KEY
