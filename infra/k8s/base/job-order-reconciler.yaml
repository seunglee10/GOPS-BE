# 역할: 수동/제한적 주문 대사 작업을 실행합니다.
# 사용: 운영에서는 KIS 조회 결과 rows JSON 또는 별도 Job patch로 입력 범위를 제한해 실행합니다.
apiVersion: batch/v1
kind: Job
metadata:
  name: order-reconciler
  namespace: alfaka-market-data
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: order-reconciler
    spec:
      restartPolicy: Never
      serviceAccountName: alfaka-market-data-sa
      containers:
        - name: order-reconciler
          image: YOUR_ECR_REPOSITORY/gops-order-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "systems/order/jobs/reconciler/main.py"]
          envFrom:
            - configMapRef:
                name: alfaka-market-data-config
            - secretRef:
                name: alfaka-order-db-secret
                optional: true
          volumeMounts:
            - name: kis-token-cache
              mountPath: /kis-cache
      volumes:
        - name: kis-token-cache
          emptyDir: {}
