# 역할: 로컬 한 대의 Docker에서 운영 아키텍처의 각 서버 역할을 컨테이너로 흉내 냅니다.
# 사용: AWS/EKS 배포 전 연결 계약과 데이터 흐름만 검증합니다.
# 주의: 운영에서는 Kafka/MSK, Flink, Redis, S3가 분리된 서버/관리형 서비스입니다.
# 구역: Docker network를 app/streaming/data로 나눠 AWS subnet 구조를 가볍게 흉내 냅니다.
services:
  kafka:
    image: apache/kafka:latest
    container_name: alfaka-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://localhost:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - streaming_net

  kafka-init:
    image: apache/kafka:latest
    container_name: alfaka-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -ec
      - |
        for topic in market.raw.bars market.raw.updated-bars market.raw.trades market.raw.daily-bars market.raw.statuses market.raw.quotes market.raw.corrections market.raw.cancel-errors market.ticks.v1 market.candles.live.1m.v1 market.candles.closed.v1 market.status.v1 market.volume-profile-bins.1m.v1 orders.commands.v1 broker.submit-results.v1 broker.order-events.v1 orders.dlq.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$${topic}" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"
    networks:
      - streaming_net

  redis:
    image: redis:7-alpine
    container_name: alfaka-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - data_net

  postgres:
    image: postgres:16-alpine
    container_name: alfaka-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: "gops"
      POSTGRES_USER: "gops"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-gops_dev_password}"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gops -d gops >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - data_net

  minio:
    profiles: ["local-s3"]
    image: minio/minio:latest
    container_name: alfaka-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - data_net

  minio-init:
    profiles: ["local-s3"]
    image: minio/mc:latest
    container_name: alfaka-minio-init
    environment:
      S3_BUCKET: "${S3_BUCKET:-gops-market-data-<aws-account-id>-ap-northeast-2-an}"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb -p "local/$${S3_BUCKET}" || true
        mc ls local
    restart: "no"
    networks:
      - data_net

  clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    container_name: alfaka-clickhouse
    ports:
      - "8123:8123"
      - "9002:9000"
    environment:
      CLICKHOUSE_DB: "market_data"
      CLICKHOUSE_USER: "alfaka"
      CLICKHOUSE_PASSWORD: "alfaka"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user alfaka --password alfaka --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - data_net

  alpaca-ingestor:
    profiles: ["alpaca"]
    image: gops-market-ingestor
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gops-market-ingestor
    container_name: alfaka-alpaca-ingestor
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_CLIENT_ID: "alfaka-alpaca-ingestor-sip"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_KEY_PREFIX: ""
      AWS_REGION: "${AWS_REGION:-ap-northeast-2}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-ap-northeast-2}"
      AWS_EC2_METADATA_DISABLED: "${AWS_EC2_METADATA_DISABLED:-true}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      ALPACA_CREDENTIAL_SOURCE: "aws-secrets-manager"
      ALPACA_SECRET_NAME: "${ALPACA_SECRET_NAME:-dev/alpaca}"
      ALFAKA_REQUEST_CONFIG: "systems/market-data/config/market-data-request.json"
      ALPACA_FEED_PROFILE: "sip"
      ALPACA_UNIVERSE: "sp500"
      ALPACA_UNIVERSE_REGISTRY_PATH: "systems/market-data/config/sp500-universe.json"
      ALPACA_COLLECTION_SYMBOL_SOURCE: "universe"
      ALPACA_CHANNELS: "bars,updatedBars,dailyBars,statuses"
      ALPACA_ACTIVE_CHANNELS: "trades"
      ALPACA_ACTIVE_TICK_SUBSCRIPTION: "true"
    command: ["python", "-u", "systems/market-data/pods/market-ingestor/market_stream.py"]
    restart: unless-stopped
    networks:
      - app_net
      - data_net
      - streaming_net

  alpaca-ingestor-iex:
    profiles: ["alpaca"]
    image: gops-market-ingestor
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gops-market-ingestor
    container_name: alfaka-alpaca-ingestor-iex
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_CLIENT_ID: "alfaka-alpaca-ingestor-iex"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_KEY_PREFIX: ""
      AWS_REGION: "${AWS_REGION:-ap-northeast-2}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-ap-northeast-2}"
      AWS_EC2_METADATA_DISABLED: "${AWS_EC2_METADATA_DISABLED:-true}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      ALPACA_CREDENTIAL_SOURCE: "aws-secrets-manager"
      ALPACA_SECRET_NAME: "${ALPACA_SECRET_NAME:-dev/alpaca}"
      ALFAKA_REQUEST_CONFIG: "systems/market-data/config/market-data-request.json"
      ALPACA_FEED_PROFILE: "iex"
      ALPACA_UNIVERSE: "sp500"
      ALPACA_UNIVERSE_REGISTRY_PATH: "systems/market-data/config/sp500-universe.json"
      ALPACA_COLLECTION_SYMBOL_SOURCE: "universe"
      ALPACA_CHANNELS: "bars,updatedBars,dailyBars,statuses"
      ALPACA_ACTIVE_CHANNELS: "trades"
      ALPACA_ACTIVE_TICK_SUBSCRIPTION: "true"
    command: ["python", "-u", "systems/market-data/pods/market-ingestor/market_stream.py"]
    restart: unless-stopped
    networks:
      - app_net
      - data_net
      - streaming_net

  alpaca-ingestor-boats:
    profiles: ["alpaca"]
    image: gops-market-ingestor
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gops-market-ingestor
    container_name: alfaka-alpaca-ingestor-boats
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_CLIENT_ID: "alfaka-alpaca-ingestor-boats"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_KEY_PREFIX: ""
      AWS_REGION: "${AWS_REGION:-ap-northeast-2}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-ap-northeast-2}"
      AWS_EC2_METADATA_DISABLED: "${AWS_EC2_METADATA_DISABLED:-true}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      ALPACA_CREDENTIAL_SOURCE: "aws-secrets-manager"
      ALPACA_SECRET_NAME: "${ALPACA_SECRET_NAME:-dev/alpaca}"
      ALFAKA_REQUEST_CONFIG: "systems/market-data/config/market-data-request.json"
      ALPACA_FEED_PROFILE: "boats"
      ALPACA_UNIVERSE: "sp500"
      ALPACA_UNIVERSE_REGISTRY_PATH: "systems/market-data/config/sp500-universe.json"
      ALPACA_COLLECTION_SYMBOL_SOURCE: "universe"
      ALPACA_CHANNELS: "bars,updatedBars,dailyBars,statuses"
      ALPACA_ACTIVE_CHANNELS: "trades"
      ALPACA_ACTIVE_TICK_SUBSCRIPTION: "true"
    command: ["python", "-u", "systems/market-data/pods/market-ingestor/market_stream.py"]
    restart: unless-stopped
    networks:
      - app_net
      - data_net
      - streaming_net

  local-stream-processor:
    image: gops-market-processor
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gops-market-processor
    container_name: alfaka-local-stream-processor
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_RAW_TOPIC_PREFIX: "market.raw"
      KAFKA_PROCESSOR_GROUP_ID: "alfaka-local-stream-processor"
      KAFKA_TICKS_TOPIC: "market.ticks.v1"
      KAFKA_LIVE_CANDLE_TOPIC: "market.candles.live.1m.v1"
      KAFKA_CLOSED_CANDLE_TOPIC: "market.candles.closed.v1"
      KAFKA_STATUS_TOPIC: "market.status.v1"
      KAFKA_VOLUME_PROFILE_BINS_TOPIC: "market.volume-profile-bins.1m.v1"
      KAFKA_FLINK_GROUP_ID: "alfaka-local-stream-processor"
      VOLUME_PROFILE_PRICE_BIN_SIZE: "0.05"
      PROCESSOR_LOG_EVERY_N: "500"
      COMPONENT_HEALTH_TTL_SECONDS: "300"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_KEY_PREFIX: ""
    command: ["python", "-u", "systems/market-data/pods/market-processor/local_main.py"]
    restart: unless-stopped
    networks:
      - app_net
      - streaming_net
      - data_net

  s3-sink:
    image: gops-market-storage
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gops-market-storage
    container_name: alfaka-s3-sink
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_S3_GROUP_ID: "alfaka-processed-s3-sink"
      KAFKA_PROCESSED_TOPICS: "market.ticks.v1,market.candles.live.1m.v1,market.candles.closed.v1,market.status.v1,market.volume-profile-bins.1m.v1"
      AWS_REGION: "${AWS_REGION:-ap-northeast-2}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-ap-northeast-2}"
      AWS_EC2_METADATA_DISABLED: "${AWS_EC2_METADATA_DISABLED:-true}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      S3_ENDPOINT_URL: "${DOCKER_S3_ENDPOINT_URL:-}"
      S3_BUCKET: "${S3_BUCKET:-gops-market-data-<aws-account-id>-ap-northeast-2-an}"
      S3_FINAL_PREFIX: "${S3_FINAL_PREFIX:-market-data/final}"
      S3_LIVE_PREFIX: "${S3_LIVE_PREFIX:-market-data/live}"
      S3_MANIFEST_PREFIX: "${S3_MANIFEST_PREFIX:-market-data/manifest}"
      S3_PROCESSED_FORMAT: "parquet"
      S3_FLUSH_COUNT: "1000"
      S3_FLUSH_INTERVAL_SECONDS: "60"
      S3_PUT_MAX_ATTEMPTS: "${S3_PUT_MAX_ATTEMPTS:-3}"
      S3_PUT_RETRY_SLEEP_SECONDS: "${S3_PUT_RETRY_SLEEP_SECONDS:-1}"
    command: ["python", "-u", "systems/market-data/pods/s3-sink/processed_sink.py"]
    restart: unless-stopped
    networks:
      - app_net
      - streaming_net
      - data_net

  raw-s3-archive:
    image: gops-market-storage
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gops-market-storage
    container_name: alfaka-raw-s3-archive
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_RAW_TOPIC_PREFIX: "market.raw"
      KAFKA_RAW_S3_GROUP_ID: "alfaka-raw-s3-archive"
      AWS_REGION: "${AWS_REGION:-ap-northeast-2}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-ap-northeast-2}"
      AWS_EC2_METADATA_DISABLED: "${AWS_EC2_METADATA_DISABLED:-true}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      S3_ENDPOINT_URL: "${DOCKER_S3_ENDPOINT_URL:-}"
      S3_BUCKET: "${S3_BUCKET:-gops-market-data-<aws-account-id>-ap-northeast-2-an}"
      S3_RAW_PREFIX: "${S3_RAW_PREFIX:-market-data/raw/alpaca}"
      S3_MANIFEST_PREFIX: "${S3_MANIFEST_PREFIX:-market-data/manifest}"
      S3_RAW_FLUSH_COUNT: "1000"
      S3_RAW_FLUSH_INTERVAL_SECONDS: "60"
      S3_PUT_MAX_ATTEMPTS: "${S3_PUT_MAX_ATTEMPTS:-3}"
      S3_PUT_RETRY_SLEEP_SECONDS: "${S3_PUT_RETRY_SLEEP_SECONDS:-1}"
    command: ["python", "-u", "systems/market-data/pods/s3-sink/raw_archive_sink.py"]
    restart: unless-stopped
    networks:
      - app_net
      - streaming_net
      - data_net

  clickhouse-loader:
    image: gops-market-storage
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gops-market-storage
    container_name: alfaka-clickhouse-loader
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_CLICKHOUSE_GROUP_ID: "alfaka-clickhouse-loader"
      KAFKA_CLICKHOUSE_ENABLE_AUTO_COMMIT: "false"
      KAFKA_CLICKHOUSE_TOPICS: "market.candles.closed.v1,market.status.v1,market.volume-profile-bins.1m.v1"
      CLICKHOUSE_LOAD_TRADES: "false"
      CLICKHOUSE_HTTP_URL: "http://clickhouse:8123"
      CLICKHOUSE_DATABASE: "market_data"
      CLICKHOUSE_USER: "alfaka"
      CLICKHOUSE_PASSWORD: "alfaka"
      CLICKHOUSE_ENSURE_SESSION_COLUMNS: "true"
    command: ["python", "-u", "systems/market-data/pods/clickhouse-loader/processed_loader.py"]
    restart: unless-stopped
    networks:
      - app_net
      - streaming_net
      - data_net

  symbol-registry-sync:
    profiles: ["registry", "alpaca"]
    image: gops-market-processor
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gops-market-processor
    container_name: alfaka-symbol-registry-sync
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CLICKHOUSE_HTTP_URL: "http://clickhouse:8123"
      CLICKHOUSE_DATABASE: "market_data"
      CLICKHOUSE_USER: "alfaka"
      CLICKHOUSE_PASSWORD: "alfaka"
      CLICKHOUSE_ENSURE_SESSION_COLUMNS: "true"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_KEY_PREFIX: ""
      AWS_REGION: "${AWS_REGION:-ap-northeast-2}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-ap-northeast-2}"
      AWS_EC2_METADATA_DISABLED: "${AWS_EC2_METADATA_DISABLED:-true}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      ALPACA_CREDENTIAL_SOURCE: "aws-secrets-manager"
      ALPACA_SECRET_NAME: "${ALPACA_SECRET_NAME:-dev/alpaca}"
      ALFAKA_REQUEST_CONFIG: "systems/market-data/config/market-data-request.json"
      ALPACA_UNIVERSE: "sp500"
      ALPACA_UNIVERSE_REGISTRY_PATH: "systems/market-data/config/sp500-universe.json"
      SYMBOL_REGISTRY_ASSET_CLASS: "us_equity"
      SYMBOL_REGISTRY_STATUS: "active"
      SYMBOL_REGISTRY_REDIS_CACHE: "true"
    command: ["python", "-u", "systems/market-data/jobs/symbol-registry-sync/main.py"]
    restart: "no"
    networks:
      - app_net
      - data_net

  coverage-repair:
    profiles: ["repair"]
    image: gops-market-processor
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gops-market-processor
    container_name: alfaka-coverage-repair
    depends_on:
      gops-backend:
        condition: service_started
      backfill-worker:
        condition: service_started
    environment:
      GOPS_API_BASE_URL: "http://gops-backend:8000"
      COVERAGE_REPAIR_SYMBOLS: "${COVERAGE_REPAIR_SYMBOLS:-AAPL,MSFT,NVDA,AMZN,META,GOOGL,TSLA}"
      COVERAGE_REPAIR_INTERVALS: "${COVERAGE_REPAIR_INTERVALS:-1m,5m,10m,1D,1W,1M}"
      COVERAGE_REPAIR_DRY_RUN: "${COVERAGE_REPAIR_DRY_RUN:-true}"
      COVERAGE_REPAIR_FORCE: "${COVERAGE_REPAIR_FORCE:-false}"
    command: ["python", "-u", "systems/market-data/jobs/coverage-repair/main.py"]
    restart: "no"
    networks:
      - app_net
      - data_net

  initial-load:
    profiles: ["repair"]
    image: gops-market-processor
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gops-market-processor
    container_name: alfaka-initial-load
    depends_on:
      redis:
        condition: service_healthy
      backfill-worker:
        condition: service_started
    environment:
      REDIS_URL: "redis://redis:6379/0"
      ALFAKA_REQUEST_CONFIG: "systems/market-data/config/market-data-request.json"
      ALPACA_UNIVERSE: "sp500"
      ALPACA_UNIVERSE_REGISTRY_PATH: "systems/market-data/config/sp500-universe.json"
      INITIAL_LOAD_SYMBOLS: "${INITIAL_LOAD_SYMBOLS:-universe}"
      INITIAL_LOAD_INTERVALS: "${INITIAL_LOAD_INTERVALS:-1D}"
      INITIAL_LOAD_START: "${INITIAL_LOAD_START:-}"
      INITIAL_LOAD_END: "${INITIAL_LOAD_END:-}"
      INITIAL_LOAD_DRY_RUN: "${INITIAL_LOAD_DRY_RUN:-true}"
      INITIAL_LOAD_FORCE: "${INITIAL_LOAD_FORCE:-false}"
      INITIAL_LOAD_SOURCE_PREFERENCE: "${INITIAL_LOAD_SOURCE_PREFERENCE:-coverage-first}"
      INITIAL_LOAD_MAX_ENQUEUE: "${INITIAL_LOAD_MAX_ENQUEUE:-100}"
      INITIAL_LOAD_MAX_BACKLOG: "${INITIAL_LOAD_MAX_BACKLOG:-1000}"
      HISTORICAL_1M_MINUTES_PER_TRADING_DAY: "${HISTORICAL_1M_MINUTES_PER_TRADING_DAY:-960}"
      BACKFILL_INITIAL_LOAD_1M_MIN_START: "${BACKFILL_INITIAL_LOAD_1M_MIN_START:-2025-04-01T00:00:00Z}"
      S3_HISTORICAL_RAW_PARTITION_MODE: "${S3_HISTORICAL_RAW_PARTITION_MODE:-chunk}"
      S3_HISTORICAL_PROCESSED_MANIFEST_LAYOUT: "${S3_HISTORICAL_PROCESSED_MANIFEST_LAYOUT:-compact}"
    command: ["python", "-u", "systems/market-data/jobs/initial-load/main.py"]
    restart: "no"
    networks:
      - app_net
      - data_net

  gops-backend:
    image: gops-api-server
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gops-backend
    container_name: alfaka-gops-backend
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      order-migrations:
