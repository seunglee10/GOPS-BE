# 역할: 로컬 한 대의 Docker에서 운영 아키텍처의 각 서버 역할을 컨테이너로 흉내 냅니다.
# 사용: AWS/EKS 배포 전 연결 계약과 데이터 흐름만 검증합니다.
# 주의: 운영에서는 Kafka/MSK, Flink, Redis, S3가 분리된 서버/관리형 서비스입니다.
# 구역: Docker network를 app/streaming/data로 나눠 AWS subnet 구조를 가볍게 흉내 냅니다.
services:
  kafka:
    image: apache/kafka:latest
    container_name: alfaka-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://localhost:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - streaming_net

  kafka-init:
    image: apache/kafka:latest
    container_name: alfaka-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -ec
      - |
        for topic in market.raw.bars market.raw.updated-bars market.raw.trades market.raw.daily-bars market.raw.statuses market.raw.quotes market.raw.corrections market.raw.cancel-errors market.ticks.v1 market.candles.live.1m.v1 market.candles.closed.v1 market.status.v1 market.volume-profile-bins.1m.v1 orders.commands.v1 broker.submit-results.v1 broker.order-events.v1 orders.dlq.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$${topic}" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"
    networks:
      - streaming_net

  redis:
    image: redis:7-alpine
    container_name: alfaka-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - data_net

  postgres:
    image: postgres:16-alpine
    container_name: alfaka-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: "gops"
      POSTGRES_USER: "gops"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-gops_dev_password}"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gops -d gops >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - data_net

  minio:
    profiles: ["local-s3"]
    image: minio/minio:latest
    container_name: alfaka-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - data_net

  minio-init:
    profiles: ["local-s3"]
    image: minio/mc:latest
    container_name: alfaka-minio-init
    environment:
      S3_BUCKET: "${S3_BUCKET:-gops-market-data-<aws-account-id>-ap-northeast-2-an}"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb -p "local/$${S3_BUCKET}" || true
        mc ls local
    restart: "no"
    networks:
      - data_net

  clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    container_name: alfaka-clickhouse
    ports:
      - "8123:8123"
      - "9002:9000"
    environment:
      CLICKHOUSE_DB: "market_data"
      CLICKHOUSE_USER: "alfaka"
      CLICKHOUSE_PASSWORD: "alfaka"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user alfaka --password alfaka --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - data_net

  alpaca-ingestor:
    profiles: ["alpaca"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: alfaka-alpaca-ingestor
    env_file: .env
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_KEY_PREFIX: ""
      ALPACA_CHANNELS: "bars,updatedBars,dailyBars,statuses"
      ALPACA_ACTIVE_CHANNELS: "trades"
      ALPACA_ACTIVE_TICK_SUBSCRIPTION: "true"
    command: ["python", "-u", "services/01-alpaca-connector/market_stream.py"]
    restart: unless-stopped
    networks:
      - app_net
      - data_net
      - streaming_net

  local-stream-processor:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: alfaka-local-stream-processor
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_RAW_TOPIC_PREFIX: "market.raw"
      KAFKA_TICKS_TOPIC: "market.ticks.v1"
      KAFKA_LIVE_CANDLE_TOPIC: "market.candles.live.1m.v1"
      KAFKA_CLOSED_CANDLE_TOPIC: "market.candles.closed.v1"
      KAFKA_STATUS_TOPIC: "market.status.v1"
      KAFKA_VOLUME_PROFILE_BINS_TOPIC: "market.volume-profile-bins.1m.v1"
      KAFKA_FLINK_GROUP_ID: "alfaka-local-stream-processor"
      VOLUME_PROFILE_PRICE_BIN_SIZE: "0.05"
      PROCESSOR_LOG_EVERY_N: "500"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_KEY_PREFIX: ""
    command: ["python", "-u", "services/03-flink-stream-processor/local_main.py"]
    restart: unless-stopped
    networks:
      - app_net
      - streaming_net
      - data_net

  s3-sink:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: alfaka-s3-sink
    env_file: .env
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_S3_GROUP_ID: "alfaka-processed-s3-sink"
      KAFKA_PROCESSED_TOPICS: "market.ticks.v1,market.candles.live.1m.v1,market.candles.closed.v1,market.status.v1,market.volume-profile-bins.1m.v1"
      AWS_REGION: "${AWS_REGION:-ap-northeast-2}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-ap-northeast-2}"
      AWS_EC2_METADATA_DISABLED: "${AWS_EC2_METADATA_DISABLED:-true}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      S3_ENDPOINT_URL: "${DOCKER_S3_ENDPOINT_URL:-}"
      S3_BUCKET: "${S3_BUCKET:-gops-market-data-<aws-account-id>-ap-northeast-2-an}"
      S3_FINAL_PREFIX: "${S3_FINAL_PREFIX:-market-data/final}"
      S3_LIVE_PREFIX: "${S3_LIVE_PREFIX:-market-data/live}"
      S3_PROCESSED_FORMAT: "${S3_PROCESSED_FORMAT:-parquet}"
      S3_FLUSH_COUNT: "${S3_FLUSH_COUNT:-1000}"
    command: ["python", "-u", "services/06-s3-store/processed_sink.py"]
    restart: unless-stopped
    networks:
      - app_net
      - streaming_net
      - data_net

  clickhouse-loader:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: alfaka-clickhouse-loader
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_CLICKHOUSE_GROUP_ID: "alfaka-clickhouse-loader"
      KAFKA_CLICKHOUSE_TOPICS: "market.candles.closed.v1,market.status.v1,market.volume-profile-bins.1m.v1"
      CLICKHOUSE_LOAD_TRADES: "false"
      CLICKHOUSE_HTTP_URL: "http://clickhouse:8123"
      CLICKHOUSE_DATABASE: "market_data"
      CLICKHOUSE_USER: "alfaka"
      CLICKHOUSE_PASSWORD: "alfaka"
    command: ["python", "-u", "services/05-clickhouse-store/processed_loader.py"]
    restart: unless-stopped
    networks:
      - app_net
      - streaming_net
      - data_net

  symbol-registry-sync:
    profiles: ["registry", "alpaca"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: alfaka-symbol-registry-sync
    env_file: .env
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CLICKHOUSE_HTTP_URL: "http://clickhouse:8123"
      CLICKHOUSE_DATABASE: "market_data"
      CLICKHOUSE_USER: "alfaka"
      CLICKHOUSE_PASSWORD: "alfaka"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_KEY_PREFIX: ""
      SYMBOL_REGISTRY_ASSET_CLASS: "us_equity"
      SYMBOL_REGISTRY_STATUS: "active"
      SYMBOL_REGISTRY_REDIS_CACHE: "true"
    command: ["python", "-u", "-m", "alfaka.tools.sync_symbol_registry"]
    restart: "no"
    networks:
      - app_net
      - data_net

  gops-backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gops-backend
    container_name: alfaka-gops-backend
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      order-migrations:
        condition: service_completed_successfully
    environment:
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "postgresql://gops:${POSTGRES_PASSWORD:-gops_dev_password}@postgres:5432/gops"
      ORDER_REPOSITORY: "postgres"
      KIS_ENV: "${KIS_ENV:-demo}"
      KAFKA_ACCOUNT_ALIAS: "${KAFKA_ACCOUNT_ALIAS:-demo-account}"
      IDEMPOTENCY_HASH_SECRET: "${IDEMPOTENCY_HASH_SECRET:-local-dev-idempotency-secret}"
      CLICKHOUSE_HTTP_URL: "http://clickhouse:8123"
      CLICKHOUSE_DATABASE: "market_data"
      CLICKHOUSE_USER: "alfaka"
      CLICKHOUSE_PASSWORD: "alfaka"
      ALFAKA_PACKAGES_PATH: "/app/packages"
      REDIS_KEY_PREFIX: ""
      BACKFILL_EXECUTION_MODE: "queue"
      BACKFILL_STATUS_TTL_SECONDS: "86400"
      BACKFILL_DEFAULT_LOOKBACK_HOURS: "8760"
      AWS_REGION: "${AWS_REGION:-ap-northeast-2}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-ap-northeast-2}"
      AWS_EC2_METADATA_DISABLED: "${AWS_EC2_METADATA_DISABLED:-true}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      ALPACA_SECRET_NAME: "${ALPACA_SECRET_NAME:-dev/alpaca}"
      S3_ENDPOINT_URL: "${DOCKER_S3_ENDPOINT_URL:-}"
      S3_BUCKET: "${S3_BUCKET:-gops-market-data-<aws-account-id>-ap-northeast-2-an}"
      S3_RAW_PREFIX: "${S3_RAW_PREFIX:-market-data/raw/alpaca}"
      S3_FINAL_PREFIX: "${S3_FINAL_PREFIX:-market-data/final}"
      S3_PROCESSED_FORMAT: "${S3_PROCESSED_FORMAT:-jsonl}"
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - app_net
      - data_net

  order-migrations:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: alfaka-order-migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://gops:${POSTGRES_PASSWORD:-gops_dev_password}@postgres:5432/gops"
    command: ["python", "-u", "-m", "kis_trader.cli", "migrate"]
    restart: "no"
    networks:
      - data_net

  order-outbox-publisher:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: alfaka-order-outbox-publisher
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      order-migrations:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://gops:${POSTGRES_PASSWORD:-gops_dev_password}@postgres:5432/gops"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_ACCOUNT_ALIAS: "${KAFKA_ACCOUNT_ALIAS:-demo-account}"
      IDEMPOTENCY_HASH_SECRET: "${IDEMPOTENCY_HASH_SECRET:-local-dev-idempotency-secret}"
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          python -u -m kis_trader.cli outbox-publish --limit 100
          sleep 2
        done
    restart: unless-stopped
    networks:
      - data_net
      - streaming_net

  kis-broker-adapter:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: alfaka-kis-broker-adapter
    env_file: .env
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      order-migrations:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://gops:${POSTGRES_PASSWORD:-gops_dev_password}@postgres:5432/gops"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KIS_ENV: "${KIS_ENV:-demo}"
      KIS_SECRET_NAME: "${KIS_SECRET_NAME:-dev/kis}"
      KIS_DEMO_APP_KEY: "${KIS_DEMO_APP_KEY:-}"
      KIS_DEMO_APP_SECRET: "${KIS_DEMO_APP_SECRET:-}"
      KIS_DEMO_ACCOUNT_NO: "${KIS_DEMO_ACCOUNT_NO:-}"
      KIS_ACCOUNT_PRODUCT_CODE: "${KIS_ACCOUNT_PRODUCT_CODE:-01}"
      KIS_TOKEN_CACHE_PATH: "/kis-cache/demo-token.json"
      KIS_TIMEOUT_SECONDS: "${KIS_TIMEOUT_SECONDS:-5}"
    command:
      - /bin/sh
      - -c
      - python -u -m kis_trader.cli broker-adapter --timeout-seconds 1.0 $${KIS_BROKER_ADAPTER_ARGS:---fake-kis success}
    restart: unless-stopped
    volumes:
      - kis_token_cache:/kis-cache
    networks:
      - data_net
      - streaming_net

  backfill-worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: alfaka-backfill-worker
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      REDIS_URL: "redis://redis:6379/0"
      CLICKHOUSE_HTTP_URL: "http://clickhouse:8123"
      CLICKHOUSE_DATABASE: "market_data"
      CLICKHOUSE_USER: "alfaka"
      CLICKHOUSE_PASSWORD: "alfaka"
      BACKFILL_EXECUTION_MODE: "queue"
      BACKFILL_WORKER_POLL_SECONDS: "5"
      BACKFILL_DEFAULT_LOOKBACK_HOURS: "8760"
      AWS_REGION: "${AWS_REGION:-ap-northeast-2}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-ap-northeast-2}"
      AWS_EC2_METADATA_DISABLED: "${AWS_EC2_METADATA_DISABLED:-true}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      ALPACA_SECRET_NAME: "${ALPACA_SECRET_NAME:-dev/alpaca}"
      S3_ENDPOINT_URL: "${DOCKER_S3_ENDPOINT_URL:-}"
      S3_BUCKET: "${S3_BUCKET:-gops-market-data-<aws-account-id>-ap-northeast-2-an}"
      S3_RAW_PREFIX: "${S3_RAW_PREFIX:-market-data/raw/alpaca}"
      S3_FINAL_PREFIX: "${S3_FINAL_PREFIX:-market-data/final}"
      S3_PROCESSED_FORMAT: "${S3_PROCESSED_FORMAT:-jsonl}"
    command: ["python", "-u", "-m", "alfaka.backfill.worker"]
    restart: unless-stopped
    networks:
      - app_net
      - data_net

  gops-frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gops-frontend
    container_name: alfaka-gops-frontend
    depends_on:
      - gops-backend
    environment:
      VITE_BACKEND_TARGET: "http://gops-backend:8000"
    ports:
      - "5173:5173"
    restart: unless-stopped
    networks:
      - app_net

volumes:
  redis_data:
  minio_data:
  clickhouse_data:
  postgres_order_data:
  kis_token_cache:

networks:
  app_net:
    name: alfaka-app-net
    driver: bridge
  streaming_net:
    name: alfaka-streaming-net
    driver: bridge
  data_net:
    name: alfaka-data-net
    driver: bridge
