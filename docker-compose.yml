# 역할: 로컬 한 대의 Docker에서 운영 아키텍처의 각 서버 역할을 컨테이너로 흉내 냅니다.
# 사용: AWS/EKS 배포 전 연결 계약과 데이터 흐름만 검증합니다.
# 주의: 운영에서는 Kafka/MSK, Python processor pods, Redis, S3가 분리된 서버/관리형 서비스입니다.
# 구역: Docker network를 app/streaming/data로 나눠 AWS subnet 구조를 가볍게 흉내 냅니다.
services:
  kafka:
    image: apache/kafka:latest
    container_name: alfaka-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://localhost:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - streaming_net

  kafka-init:
    image: apache/kafka:latest
    container_name: alfaka-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -ec
      - |
        for topic in \
          market.input.realtime.trades.v1 \
          market.input.realtime.quotes.v1 \
          market.input.realtime.bars.1m.v1 \
          market.input.realtime.updated-bars.1m.v1 \
          market.input.realtime.daily-bars.v1 \
          market.input.realtime.events.v1 \
          market.realtime.ticks.to.1m.v1 \
          market.realtime.ticks.to.5m.v1 \
          market.realtime.ticks.to.10m.v1 \
          market.realtime.ticks.to.1d.v1 \
          market.realtime.ticks.to.1w.v1 \
          market.realtime.ticks.to.1mo.v1 \
          market.layer.candles.live.v1 \
          market.layer.candles.closed.v1 \
          market.layer.trades.v1 \
          market.layer.quotes.v1 \
          market.layer.events.v1 \
          market.news.alpaca.v1 \
          market.news.daily-summary-dirty.v1 \
          market.chart-derived.requests.v1 \
          market.chart-derived.dlq.v1 \
          orders.commands.v1 \
          broker.submit-results.v1 \
          broker.order-events.v1 \
          orders.dlq.v1 \
          agents.market-events.v1 \
          agents.analysis-requests.v1 \
          agents.deep-analysis-requests.v1 \
          agents.analysis-results.v1 \
          agents.query-understanding-events.v1 \
          agents.notification-decisions.v1 \
          agents.dlq.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$${topic}" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"
    networks:
      - streaming_net

  redis:
    image: redis:7-alpine
    container_name: alfaka-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "no", "--save", "", "--dir", "/tmp"]
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(redis-cli ping)\" = PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - data_net

  postgres:
    image: postgres:16-alpine
    container_name: alfaka-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: "gops"
      POSTGRES_USER: "gops"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-gops_dev_password}"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gops -d gops >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - data_net

  minio:
    profiles: ["local-s3"]
    image: minio/minio:latest
    container_name: alfaka-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - data_net

  minio-init:
    profiles: ["local-s3"]
    image: minio/mc:latest
    container_name: alfaka-minio-init
    environment:
      S3_BUCKET: "${S3_BUCKET:-gops-market-data-<aws-account-id>-ap-northeast-2-an}"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb -p "local/$${S3_BUCKET}" || true
        mc ls local
    restart: "no"
    networks:
      - data_net

  clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    container_name: alfaka-clickhouse
    ports:
      - "8123:8123"
      - "9002:9000"
    environment:
      CLICKHOUSE_DB: "market_data"
      CLICKHOUSE_USER: "alfaka"
      CLICKHOUSE_PASSWORD: "alfaka"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user alfaka --password alfaka --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - data_net

  graphdb:
    profiles: ["graphdb"]
    image: ontotext/graphdb:11.4.0
    container_name: alfaka-graphdb
    ports:
      - "7200:7200"
    environment:
      GDB_HEAP_SIZE: "${GRAPHDB_HEAP_SIZE:-4g}"
    volumes:
      - graphdb_data:/opt/graphdb/home
    restart: unless-stopped
    networks:
      - data_net

  alpaca-ingestor:
    profiles: ["alpaca"]
    image: gops-market-ingestor
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gops-market-ingestor
    container_name: alfaka-alpaca-ingestor
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_CLIENT_ID: "alfaka-alpaca-ingestor-sip"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_KEY_PREFIX: "gops:market:on-demand:v1"
      MARKET_TIMEZONE: "${MARKET_TIMEZONE:-America/New_York}"
      MARKET_CLOSED_DATES: "${MARKET_CLOSED_DATES:-}"
      MARKET_INCLUDE_DEFAULT_US_EQUITY_HOLIDAYS: "${MARKET_INCLUDE_DEFAULT_US_EQUITY_HOLIDAYS:-true}"
      AWS_REGION: "${AWS_REGION:-ap-northeast-2}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-ap-northeast-2}"
      AWS_EC2_METADATA_DISABLED: "${AWS_EC2_METADATA_DISABLED:-true}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      AWS_PROFILE: "${AWS_PROFILE:-default}"
      AWS_SDK_LOAD_CONFIG: "${AWS_SDK_LOAD_CONFIG:-1}"
      APCA_API_KEY_ID: "${APCA_API_KEY_ID:-}"
      APCA_API_SECRET_KEY: "${APCA_API_SECRET_KEY:-}"
      ALPACA_CREDENTIAL_SOURCE: "${ALPACA_CREDENTIAL_SOURCE:-aws-secrets-manager}"
      ALPACA_SECRET_NAME: "${ALPACA_SECRET_NAME:-}"
      ALFAKA_REQUEST_CONFIG: "systems/market-data/config/market-data-request.json"
      ALPACA_FEED_PROFILE: "sip"
      ALPACA_UNIVERSE: "${ALPACA_UNIVERSE:-sp500}"
      ALPACA_UNIVERSE_REGISTRY_PATH: "${ALPACA_UNIVERSE_REGISTRY_PATH:-systems/market-data/config/sp500-universe.json}"
      ALPACA_COLLECTION_SYMBOL_SOURCE: "${ALPACA_COLLECTION_SYMBOL_SOURCE:-universe}"
      ALPACA_CHANNELS: "bars,updatedBars,dailyBars,statuses"
      ALPACA_ACTIVE_CHANNELS: "${ALPACA_ACTIVE_CHANNELS:-trades,quotes}"
      ALPACA_ACTIVE_TICK_SUBSCRIPTION: "true"
    command: ["python", "-u", "systems/market-data/pods/market-ingestor/market_stream.py"]
    restart: unless-stopped
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    networks:
      - app_net
      - data_net
      - streaming_net

  alpaca-ingestor-boats:
    profiles: ["alpaca"]
    image: gops-market-ingestor
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gops-market-ingestor
    container_name: alfaka-alpaca-ingestor-boats
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_CLIENT_ID: "alfaka-alpaca-ingestor-boats"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_KEY_PREFIX: "gops:market:on-demand:v1"
      MARKET_TIMEZONE: "${MARKET_TIMEZONE:-America/New_York}"
      MARKET_CLOSED_DATES: "${MARKET_CLOSED_DATES:-}"
      MARKET_INCLUDE_DEFAULT_US_EQUITY_HOLIDAYS: "${MARKET_INCLUDE_DEFAULT_US_EQUITY_HOLIDAYS:-true}"
      AWS_REGION: "${AWS_REGION:-ap-northeast-2}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-ap-northeast-2}"
      AWS_EC2_METADATA_DISABLED: "${AWS_EC2_METADATA_DISABLED:-true}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      AWS_PROFILE: "${AWS_PROFILE:-default}"
      AWS_SDK_LOAD_CONFIG: "${AWS_SDK_LOAD_CONFIG:-1}"
      APCA_API_KEY_ID: "${APCA_API_KEY_ID:-}"
      APCA_API_SECRET_KEY: "${APCA_API_SECRET_KEY:-}"
      ALPACA_CREDENTIAL_SOURCE: "${ALPACA_CREDENTIAL_SOURCE:-aws-secrets-manager}"
      ALPACA_SECRET_NAME: "${ALPACA_SECRET_NAME:-}"
      ALFAKA_REQUEST_CONFIG: "systems/market-data/config/market-data-request.json"
      ALPACA_FEED_PROFILE: "boats"
      ALPACA_UNIVERSE: "${ALPACA_UNIVERSE:-sp500}"
      ALPACA_UNIVERSE_REGISTRY_PATH: "${ALPACA_UNIVERSE_REGISTRY_PATH:-systems/market-data/config/sp500-universe.json}"
      ALPACA_COLLECTION_SYMBOL_SOURCE: "${ALPACA_COLLECTION_SYMBOL_SOURCE:-universe}"
      ALPACA_CHANNELS: "bars,updatedBars,dailyBars,statuses"
      ALPACA_ACTIVE_CHANNELS: "${ALPACA_ACTIVE_CHANNELS:-trades,quotes}"
      ALPACA_ACTIVE_TICK_SUBSCRIPTION: "true"
    command: ["python", "-u", "systems/market-data/pods/market-ingestor/market_stream.py"]
    restart: unless-stopped
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    networks:
      - app_net
      - data_net
      - streaming_net

  alpaca-ingestor-crypto:
    profiles: ["alpaca"]
    image: gops-market-ingestor
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gops-market-ingestor
    container_name: alfaka-alpaca-ingestor-crypto
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_CLIENT_ID: "alfaka-alpaca-ingestor-crypto"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_KEY_PREFIX: "gops:market:on-demand:v1"
      AWS_REGION: "${AWS_REGION:-ap-northeast-2}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-ap-northeast-2}"
      AWS_EC2_METADATA_DISABLED: "${AWS_EC2_METADATA_DISABLED:-true}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      AWS_PROFILE: "${AWS_PROFILE:-default}"
      AWS_SDK_LOAD_CONFIG: "${AWS_SDK_LOAD_CONFIG:-1}"
      APCA_API_KEY_ID: "${APCA_API_KEY_ID:-}"
      APCA_API_SECRET_KEY: "${APCA_API_SECRET_KEY:-}"
      ALPACA_CREDENTIAL_SOURCE: "${ALPACA_CREDENTIAL_SOURCE:-aws-secrets-manager}"
      ALPACA_SECRET_NAME: "${ALPACA_SECRET_NAME:-}"
      ALFAKA_REQUEST_CONFIG: "systems/market-data/config/market-data-request.json"
      ALPACA_FEED_PROFILE: "crypto-us"
      ALPACA_CRYPTO_LOCATION: "${ALPACA_CRYPTO_LOCATION:-us}"
      ALPACA_CRYPTO_SYMBOLS: "${ALPACA_CRYPTO_SYMBOLS:-BTCUSD}"
      ALPACA_COLLECTION_SYMBOLS: "${ALPACA_CRYPTO_SYMBOLS:-BTCUSD}"
      ALPACA_CHANNELS: "${ALPACA_CRYPTO_CHANNELS:-bars,updatedBars,dailyBars,trades,quotes}"
      ALPACA_ACTIVE_TICK_SUBSCRIPTION: "false"
      ALPACA_ENFORCE_FEED_SESSION_WINDOW: "true"
    command: ["python", "-u", "systems/market-data/pods/market-ingestor/market_stream.py"]
    restart: unless-stopped
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    networks:
      - app_net
      - data_net
      - streaming_net

  alpaca-news-ingestor:
    profiles: ["alpaca"]
    image: gops-market-ingestor
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gops-market-ingestor
    container_name: alfaka-alpaca-news-ingestor
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_NEWS_TOPIC: "market.news.alpaca.v1"
      APCA_API_KEY_ID: "${APCA_API_KEY_ID:-}"
      APCA_API_SECRET_KEY: "${APCA_API_SECRET_KEY:-}"
      ALPACA_CREDENTIAL_SOURCE: "${ALPACA_CREDENTIAL_SOURCE:-aws-secrets-manager}"
      ALPACA_SECRET_NAME: "${ALPACA_SECRET_NAME:-}"
      ALPACA_SYMBOLS: "${ALPACA_SYMBOLS:-}"
      AWS_REGION: "${AWS_REGION:-ap-northeast-2}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-ap-northeast-2}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      AWS_PROFILE: "${AWS_PROFILE:-default}"
      AWS_SDK_LOAD_CONFIG: "${AWS_SDK_LOAD_CONFIG:-1}"
      ALPACA_NEWS_POLL_SECONDS: "${ALPACA_NEWS_POLL_SECONDS:-300}"
      ALPACA_NEWS_LIMIT: "${ALPACA_NEWS_LIMIT:-50}"
      ALPACA_NEWS_INCLUDE_CONTENT: "${ALPACA_NEWS_INCLUDE_CONTENT:-true}"
      NEWS_S3_ARCHIVE_ENABLED: "${NEWS_S3_ARCHIVE_ENABLED:-false}"
      S3_ENDPOINT_URL: "${DOCKER_S3_ENDPOINT_URL:-}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      S3_SESSION_TOKEN: "${S3_SESSION_TOKEN:-}"
      S3_BUCKET: "${S3_BUCKET:-gops-market-data-<aws-account-id>-ap-northeast-2-an}"
      S3_RAW_PREFIX: "${S3_RAW_PREFIX:-market-data/raw/alpaca}"
    command: ["python", "-u", "systems/market-data/pods/news-ingestor/main.py"]
    restart: unless-stopped
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    networks:
      - app_net
      - streaming_net

  news-backfill:
    profiles: ["jobs"]
    image: gops-market-storage
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gops-market-storage
    container_name: alfaka-news-backfill
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_NEWS_TOPIC: "market.news.alpaca.v1"
      AWS_REGION: "${AWS_REGION:-ap-northeast-2}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-ap-northeast-2}"
      AWS_EC2_METADATA_DISABLED: "${AWS_EC2_METADATA_DISABLED:-true}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      AWS_PROFILE: "${AWS_PROFILE:-default}"
      AWS_SDK_LOAD_CONFIG: "${AWS_SDK_LOAD_CONFIG:-1}"
      ALPACA_CREDENTIAL_SOURCE: "aws-secrets-manager"
      ALPACA_SECRET_NAME: "${ALPACA_SECRET_NAME:-dev/alpaca}"
      S3_ENDPOINT_URL: "${DOCKER_S3_ENDPOINT_URL:-}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      S3_SESSION_TOKEN: "${S3_SESSION_TOKEN:-}"
      S3_BUCKET: "${S3_BUCKET:-gops-market-data-<aws-account-id>-ap-northeast-2-an}"
      S3_RAW_PREFIX: "${S3_RAW_PREFIX:-market-data/raw/alpaca}"
      ALPACA_NEWS_MAX_RETRIES: "${ALPACA_NEWS_MAX_RETRIES:-5}"
      ALPACA_NEWS_RETRY_SLEEP_SECONDS: "${ALPACA_NEWS_RETRY_SLEEP_SECONDS:-1}"
      ALPACA_NEWS_RETRY_MAX_SLEEP_SECONDS: "${ALPACA_NEWS_RETRY_MAX_SLEEP_SECONDS:-30}"
      NEWS_BACKFILL_UNIVERSE: "${NEWS_BACKFILL_UNIVERSE:-sp500}"
      NEWS_BACKFILL_SYMBOLS: "${NEWS_BACKFILL_SYMBOLS:-}"
      NEWS_BACKFILL_START: "${NEWS_BACKFILL_START:-}"
      NEWS_BACKFILL_END: "${NEWS_BACKFILL_END:-}"
      NEWS_BACKFILL_DAYS: "${NEWS_BACKFILL_DAYS:-365}"
      NEWS_BACKFILL_CHUNK_DAYS: "${NEWS_BACKFILL_CHUNK_DAYS:-7}"
      NEWS_BACKFILL_SHARD_INDEX: "${NEWS_BACKFILL_SHARD_INDEX:-0}"
      NEWS_BACKFILL_SHARD_COUNT: "${NEWS_BACKFILL_SHARD_COUNT:-1}"
      NEWS_BACKFILL_LIMIT: "${NEWS_BACKFILL_LIMIT:-50}"
      NEWS_BACKFILL_INCLUDE_CONTENT: "${NEWS_BACKFILL_INCLUDE_CONTENT:-true}"
      NEWS_BACKFILL_SORT: "${NEWS_BACKFILL_SORT:-asc}"
      NEWS_BACKFILL_SKIP_COMPLETED_CHUNKS: "${NEWS_BACKFILL_SKIP_COMPLETED_CHUNKS:-true}"
      NEWS_BACKFILL_PUBLISH_RECENT_TO_KAFKA: "${NEWS_BACKFILL_PUBLISH_RECENT_TO_KAFKA:-true}"
      NEWS_CLICKHOUSE_DAYS: "${NEWS_CLICKHOUSE_DAYS:-30}"
    command: ["python", "-u", "systems/market-data/jobs/news-backfill/main.py"]
    restart: "no"
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    networks:
      - app_net
      - data_net
      - streaming_net

  sec-fundamentals-backfill:
    profiles: ["jobs"]
    image: gops-market-storage
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gops-market-storage
    container_name: alfaka-sec-fundamentals-backfill
    env_file: .env
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CLICKHOUSE_HTTP_URL: "http://clickhouse:8123"
      CLICKHOUSE_DATABASE: "market_data"
      CLICKHOUSE_USER: "alfaka"
      CLICKHOUSE_PASSWORD: "alfaka"
      REDIS_URL: "redis://redis:6379/0"
      AWS_REGION: "${AWS_REGION:-ap-northeast-2}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-ap-northeast-2}"
      AWS_EC2_METADATA_DISABLED: "${AWS_EC2_METADATA_DISABLED:-true}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      AWS_PROFILE: "${AWS_PROFILE:-default}"
      AWS_SDK_LOAD_CONFIG: "${AWS_SDK_LOAD_CONFIG:-1}"
      S3_ENDPOINT_URL: "${DOCKER_S3_ENDPOINT_URL:-}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      S3_SESSION_TOKEN: "${S3_SESSION_TOKEN:-}"
      S3_BUCKET: "${S3_BUCKET:-gops-market-data-<aws-account-id>-ap-northeast-2-an}"
      SEC_COMPANYFACTS_ZIP_URL: "${SEC_COMPANYFACTS_ZIP_URL:-https://www.sec.gov/Archives/edgar/daily-index/xbrl/companyfacts.zip}"
      SEC_COMPANYFACTS_ZIP_PATH: "${SEC_COMPANYFACTS_ZIP_PATH:-}"
      SEC_FUNDAMENTALS_S3_PREFIX: "${SEC_FUNDAMENTALS_S3_PREFIX:-fundamentals/sec/companyfacts}"
      SEC_FUNDAMENTALS_DRY_RUN: "${SEC_FUNDAMENTALS_DRY_RUN:-true}"
