    networks:
      - app_net
      - data_net
      - streaming_net

  order-migrations:
    image: gops-order-worker
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gops-order-worker
    container_name: alfaka-order-migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://gops:${POSTGRES_PASSWORD:-gops_dev_password}@postgres:5432/gops"
    command: ["python", "-u", "systems/order/jobs/migrations/main.py"]
    restart: "no"
    networks:
      - data_net

  order-outbox-publisher:
    image: gops-order-worker
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gops-order-worker
    container_name: alfaka-order-outbox-publisher
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      order-migrations:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://gops:${POSTGRES_PASSWORD:-gops_dev_password}@postgres:5432/gops"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_ACCOUNT_ALIAS: "${KAFKA_ACCOUNT_ALIAS:-demo-account}"
      IDEMPOTENCY_HASH_SECRET: "${IDEMPOTENCY_HASH_SECRET:-local-dev-idempotency-secret}"
    command: ["python", "-u", "systems/order/pods/order-outbox/main.py"]
    restart: unless-stopped
    networks:
      - data_net
      - streaming_net

  kis-broker-adapter:
    image: gops-kis-adapter
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gops-kis-adapter
    container_name: alfaka-kis-broker-adapter
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      order-migrations:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://gops:${POSTGRES_PASSWORD:-gops_dev_password}@postgres:5432/gops"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KIS_ENV: "${KIS_ENV:-demo}"
      KIS_CREDENTIAL_SOURCE: "${KIS_CREDENTIAL_SOURCE:-aws-secrets-manager}"
      KIS_SECRET_NAME: "${KIS_SECRET_NAME:-tead/gops/kis}"
      KIS_DEMO_APP_KEY: "${KIS_DEMO_APP_KEY:-}"
      KIS_DEMO_APP_SECRET: "${KIS_DEMO_APP_SECRET:-}"
      KIS_DEMO_ACCOUNT_NO: "${KIS_DEMO_ACCOUNT_NO:-}"
      KIS_ACCOUNT_PRODUCT_CODE: "${KIS_ACCOUNT_PRODUCT_CODE:-01}"
      KIS_TOKEN_CACHE_PATH: "/kis-cache/demo-token.json"
      KIS_TIMEOUT_SECONDS: "${KIS_TIMEOUT_SECONDS:-5}"
      KIS_BROKER_ADAPTER_ARGS: "${KIS_BROKER_ADAPTER_ARGS:-}"
      AWS_REGION: "${AWS_REGION:-ap-northeast-2}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-ap-northeast-2}"
      AWS_EC2_METADATA_DISABLED: "${AWS_EC2_METADATA_DISABLED:-true}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
    command: ["python", "-u", "systems/order/pods/kis-adapter/main.py"]
    restart: unless-stopped
    volumes:
      - kis_token_cache:/kis-cache
    networks:
      - data_net
      - streaming_net

  order-reconciler:
    profiles: ["reconciliation"]
    image: gops-order-worker
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gops-order-worker
    container_name: alfaka-order-reconciler
    depends_on:
      postgres:
        condition: service_healthy
      order-migrations:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://gops:${POSTGRES_PASSWORD:-gops_dev_password}@postgres:5432/gops"
      KIS_ENV: "${KIS_ENV:-demo}"
      KIS_CREDENTIAL_SOURCE: "${KIS_CREDENTIAL_SOURCE:-aws-secrets-manager}"
      KIS_SECRET_NAME: "${KIS_SECRET_NAME:-tead/gops/kis}"
      KIS_TOKEN_CACHE_PATH: "/kis-cache/demo-token.json"
      KIS_TIMEOUT_SECONDS: "${KIS_TIMEOUT_SECONDS:-5}"
      AWS_REGION: "${AWS_REGION:-ap-northeast-2}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-ap-northeast-2}"
      AWS_EC2_METADATA_DISABLED: "${AWS_EC2_METADATA_DISABLED:-true}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
    command: ["python", "-u", "systems/order/jobs/reconciler/main.py"]
    restart: "no"
    volumes:
      - kis_token_cache:/kis-cache
    networks:
      - data_net

  gops-frontend:
    image: gops-frontend
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gops-frontend
    container_name: alfaka-gops-frontend
    depends_on:
      - gops-backend
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - app_net

volumes:
  redis_data:
  minio_data:
  clickhouse_data:
  graphdb_data:
    name: nasdaq_fibo_graphdb_data
    external: true
  postgres_order_data:
  kis_token_cache:

networks:
  app_net:
    name: alfaka-app-net
    driver: bridge
  streaming_net:
    name: alfaka-streaming-net
    driver: bridge
  data_net:
    name: alfaka-data-net
    driver: bridge
