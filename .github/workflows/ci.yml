name: CI

# PR마다 파이썬 테스트와 ERD drift 검사를 돌립니다.
# 배포는 deploy-dev.yml(수동)이 담당합니다.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and check ERD drift
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gops_erd_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gops_erd_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            systems/api-server/pods/api-server/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r systems/api-server/pods/api-server/requirements.txt

      - name: Run Python tests
        run: python -m pytest

      - name: Apply empty PostgreSQL migrations and check ERD drift
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gops_erd_ci
          PYTHONPATH: systems/order/shared
        run: |
          python systems/order/jobs/postgres-migrations/main.py
          python systems/agent-orchestration/jobs/chart-asset-migrations/main.py
          python scripts/erd/check_erd_drift.py --strict
