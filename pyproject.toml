[project]
name = "gops-kis-trader"
version = "0.1.0"
description = "Minimal modular Korea Investment overseas stock trading skeleton."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka>=2.8.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
kis-overseas = "kis_trader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kis_trader"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src", "."]
