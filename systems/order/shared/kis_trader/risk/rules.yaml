# Default pre-trade risk rule thresholds.
# Loaded via RISK_RULES_PATH (see kis_trader.risk.config). Values here mirror
# the code defaults; edit and point RISK_RULES_PATH at this file to tune.

# 종목당 최대 비중
single_name_max_weight: 0.20
# 섹터당 최대 비중 (경고)
sector_max_weight: 0.40

# 팻핑거: 1회 주문 금액 상한 (계좌 통화 기준)
max_order_notional: 50000
# 팻핑거: 일평균거래량 대비 주문 수량 상한 비율
max_adv_participation: 0.05
# 팻핑거: 직전가 대비 지정가 허용 괴리
price_band_pct: 0.05

# 일일 손실이 계좌의 이 비율에 도달하면 당일 신규 매수 차단 (쿨다운)
daily_loss_limit_pct: 0.03

# 심볼 -> 섹터 폴백 맵 (포지션/메트릭에 섹터가 없을 때 사용)
sector_map:
  NVDA: semiconductor
  AMD: semiconductor
  MU: semiconductor
  INTC: semiconductor
  TSM: semiconductor
  AVGO: semiconductor
  QCOM: semiconductor
  TXN: semiconductor
  AAPL: tech-hardware
  MSFT: software
  GOOGL: internet
  AMZN: internet
  META: internet
  TSLA: auto
